name: OpenOFC v5.3 smart baseline + opponent history

on:
  push:
    branches:
      - 'agent/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build-package:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply OpenOFC repairs through v5.3 smart baseline
        shell: pwsh
        run: |
          python -c "import tools.apply_openofc_runtime_repair as r; r.patch_transform(); r.patch_opponent_discards(); r.patch_capture(); print('OpenOFC runtime source repair applied successfully')"
          python tools/apply_openofc_log248_repair.py
          python tools/run_openofc_gameflow_v2.py
          python tools/apply_openofc_normal_flow_v3.py
          python tools/apply_openofc_phase_flow_v4.py
          python tools/apply_openofc_phase_flow_v41.py
          python tools/apply_openofc_round_discard_exit_v42.py
          python tools/apply_openofc_normal_completion_v43.py
          python tools/apply_openofc_simultaneous_dealer_v44.py
          python tools/run_openofc_fantasy_v5.py
          python tools/apply_openofc_opponent_history_v52.py
          python tools/run_openofc_smart_policy_v53.py
          if ($LASTEXITCODE -ne 0) { throw "OpenOFC v5.3 patch chain failed: $LASTEXITCODE" }

      - name: Assert v5.3 source contract
        shell: pwsh
        run: |
          $policy = Get-Content -Raw 'OpenHoldem/COFCBaselinePolicy.cpp'
          $runtime = Get-Content -Raw 'OpenHoldem/COFCRuntimeController.cpp'
          $scraper = Get-Content -Raw 'OpenHoldem/COFCScraper.cpp'
          $recorder = Get-Content -Raw 'OpenHoldem/COFCOpponentHistoryRecorder.cpp'
          foreach ($needle in @('OPENOFC_SMART_BASELINE_V53','NormalFantasyEntryValue','FantasyContinuationValue','OpeningStructureAdjustment','FiveCardPotential','TopPotential')) {
            if (-not $policy.Contains($needle)) { throw "smart policy marker missing: $needle" }
          }
          if (-not $runtime.Contains('engine=SMART_BASELINE_V53')) { throw 'runtime smart-policy marker missing' }
          if ($policy.Contains('deviation) * 1000000LL')) { throw 'old rigid 1/2/2 dominance remains' }
          foreach ($needle in @('OPENOFC_OPPONENT_HISTORY_V52','reveal_scrape','passive=1')) {
            if (-not $scraper.Contains($needle)) { throw "history scrape marker missing: $needle" }
          }
          foreach ($needle in @('REVEAL_EDGE_PARTIAL','COMPLETE_REVEAL','opponent_hands.jsonl')) {
            if (-not $recorder.Contains($needle)) { throw "history recorder marker missing: $needle" }
          }

      - name: Materialize history-aware clean TableMap
        shell: pwsh
        run: |
          python tools/materialize_openofc_fantasy_v52_history_tablemap.py
          if ($LASTEXITCODE -ne 0) { throw "TableMap materialization failed: $LASTEXITCODE" }
          $tm = Get-Content -Raw 'OpenOFC/TableMaps/KKPoker_OpenOFC_JokerUltimate_v5_2.tm'
          foreach ($required in @('r$ofc_p0_discard0rank','r$ofc_p0_discard3suit','r$ofc_p0_name','t2$','t4$','s$openofc_opponent_history 1')) {
            if (-not $tm.Contains($required)) { throw "history TableMap field missing: $required" }
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Compile and run deterministic policy selftest
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $command = '"' + $devcmd + '" -arch=x86 -host_arch=x64 && cl /nologo /EHsc /O2 /MD /std:c++14 /DDEEPOFC_POLICY_STANDALONE /DDEEPOFC_TURNPLAN_STANDALONE /I OpenHoldem OpenHoldem\COFCBaselinePolicy.cpp OpenHoldem\COFCTurnPlan.cpp OpenHoldem\COFCBaselinePolicySelftest.cpp /Fe:COFCBaselinePolicySelftest.exe && COFCBaselinePolicySelftest.exe'
          cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw "Policy selftest failed: $LASTEXITCODE" }

      - name: Build dependency chain
        shell: pwsh
        run: |
          $root = (Resolve-Path '.').Path + '\'
          $common = @('/m','/t:Build','/p:Configuration=Release','/p:Platform=Win32',"/p:SolutionDir=$root",'/v:minimal')
          $projects = @(
            'DLLs/Files_DLL/Files.vcxproj',
            'DLLs/WindowFunctions_DLL/window_functions.vcxproj',
            'DLLs/StringFunctions_DLL/string_functions.vcxproj',
            'DLLs/Debug_DLL/Debug.vcxproj',
            'DLLs/Preferences_DLL/Preferences.vcxproj',
            'DLLs/Globals_DLL/globals.vcxproj',
            'DLLs/GamestateValidation_DLL/GamestateValidation.vcxproj',
            'DLLs/User_DLL/user.vcxproj',
            'PokerTracker_Query_Definitions/pokertracker_query_definitions.vcxproj',
            'Reference Mouse DLL/Reference Mouse DLL.vcxproj',
            'Reference Keyboard DLL/Reference Keyboard DLL.vcxproj'
          )
          foreach ($project in $projects) {
            & msbuild $project @common
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $project" }
          }

      - name: Build OpenHoldem Release Win32
        shell: pwsh
        run: |
          $root = (Resolve-Path '.').Path + '\'
          msbuild OpenHoldem/OpenHoldem.vcxproj /m /t:Build /p:Configuration=Release /p:Platform=Win32 "/p:SolutionDir=$root" /p:BuildProjectReferences=true /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "OpenHoldem Win32 build failed: $LASTEXITCODE" }

      - name: Collect runtime package
        shell: pwsh
        run: |
          $release = 'Release'
          $out = 'artifact/OpenOFC_v5_3_SmartBaseline_OpponentHistory_Windows'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "$release/OpenHoldem.exe" $out
          Get-ChildItem $release -Filter '*.dll' | Copy-Item -Destination $out
          if (Test-Path "$release/tessdata") { Copy-Item "$release/tessdata" "$out/tessdata" -Recurse }
          New-Item -ItemType Directory -Force -Path "$out/scraper" | Out-Null
          Copy-Item 'OpenOFC/TableMaps/KKPoker_OpenOFC_JokerUltimate_v5_2.tm' "$out/scraper/KKPoker_OpenOFC_JokerUltimate_v5_2.tm"
          New-Item -ItemType Directory -Force -Path "$out/tools" | Out-Null
          Copy-Item 'tools/import_openofc_opponent_hands.py' "$out/tools/"
          Copy-Item 'tools/openofc_opponent_history_schema.sql' "$out/tools/"
          @'
          OpenOFC v5.3 Smart Baseline + Opponent History

          Interim strategy upgrade:
          - old million-point rigid 1/2/2 opening-shape rule removed;
          - QQ/KK/AA and trips top explicitly value Fantasy entry;
          - middle/bottom value pair/trips/full-house structure, flush concentration and straight connectivity;
          - completed normal boards include Fantasy gateway value;
          - Fantasy 14..17 exhaustive search includes Ultimate refantasy value (trips top or quads+ bottom).

          Opponent-history collection from v5.2 remains enabled. This is not the final self-play/search AI.
          '@ | Set-Content -Encoding UTF8 "$out/README_OPENOFC.txt"

      - name: Upload Windows runtime
        uses: actions/upload-artifact@v4
        with:
          name: OpenOFC_v5_3_SmartBaseline_OpponentHistory_Windows
          path: artifact/OpenOFC_v5_3_SmartBaseline_OpponentHistory_Windows
          if-no-files-found: error
