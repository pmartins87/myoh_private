name: DeepOFC R10 arbitrary drag build gate

on:
  push:
    branches: [deepofc]
    paths:
      - '.github/workflows/deepofc-r10-mouse-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-export-load-with-r9-guard:
    runs-on: windows-2022
    steps:
      - name: Checkout deepofc
        uses: actions/checkout@v4
        with:
          ref: deepofc
          fetch-depth: 0

      - name: Apply OpenHoldem mouse loader integration
        shell: pwsh
        run: .github/scripts/deepofc_r10_mouse_integrate.ps1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Locate Visual Studio toolchain
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.ATLMFC -property installationPath
          if (-not $vs) { throw 'VC ATL/MFC component not found on runner' }
          Write-Host "VS=$vs"
          msbuild -version

      - name: Build mouse DLL Release Win32
        shell: pwsh
        run: |
          $root = (Resolve-Path '.').Path + '\'
          msbuild 'Reference Mouse DLL/Reference Mouse DLL.vcxproj' /m /t:Build /p:Configuration=Release /p:Platform=Win32 "/p:SolutionDir=$root" /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "mouse.dll build failed: $LASTEXITCODE" }
          Get-ChildItem Release | Where-Object { $_.Name -match 'mouse' } | Format-Table Name,Length
          if (-not (Test-Path 'Release/mouse.dll')) { throw 'Release/mouse.dll was not produced' }

      - name: Assert MouseDragBetweenRects export
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          if (-not $vs) { throw 'Visual Studio not found' }
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $command = '"' + $devcmd + '" -arch=x86 -host_arch=x64 && dumpbin /nologo /exports Release\mouse.dll'
          $exports = cmd.exe /d /s /c $command
          $exports | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed: $LASTEXITCODE" }
          if (-not ($exports -match 'MouseDragBetweenRects')) { throw 'MouseDragBetweenRects export missing' }
          if (-not ($exports -match 'MouseClickDrag')) { throw 'Legacy MouseClickDrag export regressed' }

      - name: Build native dependency chain
        shell: pwsh
        run: |
          $root = (Resolve-Path '.').Path + '\'
          $common = @('/m','/t:Build','/p:Configuration=Release','/p:Platform=Win32',"/p:SolutionDir=$root",'/v:minimal')
          $projects = @(
            'DLLs/Files_DLL/Files.vcxproj',
            'DLLs/WindowFunctions_DLL/window_functions.vcxproj',
            'DLLs/StringFunctions_DLL/string_functions.vcxproj',
            'DLLs/Debug_DLL/Debug.vcxproj',
            'DLLs/Preferences_DLL/Preferences.vcxproj',
            'DLLs/Globals_DLL/globals.vcxproj',
            'DLLs/GamestateValidation_DLL/GamestateValidation.vcxproj',
            'DLLs/User_DLL/user.vcxproj',
            'PokerTracker_Query_Definitions/pokertracker_query_definitions.vcxproj'
          )
          foreach ($project in $projects) {
            Write-Host "=== BUILD $project ==="
            & msbuild $project @common
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $project" }
          }

      - name: Assert OpenHoldem link inputs
        shell: pwsh
        run: |
          $required = @('Preferences.lib','globals.lib','pokertracker_query_definitions.lib','Reference User DLL.lib','window_functions.lib','string_functions.lib','debug.lib','GameStateValidation.lib','files.lib')
          foreach ($name in $required) {
            if (-not (Test-Path (Join-Path 'Release' $name))) { throw "Missing link input: $name" }
          }

      - name: Build OpenHoldem Release Win32 with new loader
        shell: pwsh
        run: |
          $root = (Resolve-Path '.').Path + '\'
          msbuild OpenHoldem/OpenHoldem.vcxproj /m /t:Build /p:Configuration=Release /p:Platform=Win32 "/p:SolutionDir=$root" /p:BuildProjectReferences=true /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "OpenHoldem build failed: $LASTEXITCODE" }
          if (-not (Test-Path 'Release/OpenHoldem.exe')) { throw 'OpenHoldem.exe missing' }

      - name: Assert R9 read-only guard remains hard
        shell: pwsh
        run: |
          if (-not (Select-String -Path 'OpenHoldem/CAutoplayer.cpp' -Pattern 'DeepOFC R9 hard read-only guard' -Quiet)) {
            throw 'R9 hard read-only guard missing'
          }
          Write-Host 'R9 hard no-click guard remains present. No mouse input was exercised by this workflow.'

      - name: Persist validated loader only after all gates pass
        shell: pwsh
        run: |
          $path = 'OpenHoldem/OpenHoldem.cpp'
          $changed = git diff --name-only -- $path
          if (-not $changed) { Write-Host 'Mouse loader already persisted.'; exit 0 }
          git config user.name 'DeepOFC Build Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add -- $path
          git commit -m 'DeepOFC R10: load arbitrary card drag primitive'
          git push origin HEAD:deepofc
