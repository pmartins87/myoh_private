name: OpenOFC M4V continuation-linear target gate

on:
  pull_request:
    paths:
      - 'tools/openofc_solver/m4v_continuation_targets.py'
      - 'tools/openofc_solver/test_m4v_continuation_targets.py'
      - 'tools/openofc_solver/M4V_CONTINUATION_TARGET_CONTRACT.md'
      - '.github/workflows/openofc-m4v-continuation-targets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m4v-continuation-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Materialize certified Joker semantics
        run: python tools/openofc_solver/apply_m1b_joker_semantics.py

      - name: Prove exact action-Q transport across continuation vectors
        run: |
          python tools/openofc_solver/test_m4v_continuation_targets.py
          echo OPENOFC_M4V_GATE=PASS
