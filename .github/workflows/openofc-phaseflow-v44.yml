name: OpenOFC phase-flow v4.4 simultaneous dealer repair

on:
  push:
    branches:
      - 'agent/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build-package:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply OpenOFC source repairs through v4.4
        shell: pwsh
        run: |
          python -c "import tools.apply_openofc_runtime_repair as r; r.patch_transform(); r.patch_opponent_discards(); r.patch_capture(); print('OpenOFC runtime source repair applied successfully')"
          if ($LASTEXITCODE -ne 0) { throw "OpenOFC runtime repair failed: $LASTEXITCODE" }
          python tools/apply_openofc_log248_repair.py
          if ($LASTEXITCODE -ne 0) { throw "OpenOFC log248 repair failed: $LASTEXITCODE" }
          python tools/run_openofc_gameflow_v2.py
          if ($LASTEXITCODE -ne 0) { throw "OpenOFC gameflow v2 repair failed: $LASTEXITCODE" }
          python tools/apply_openofc_normal_flow_v3.py
          if ($LASTEXITCODE -ne 0) { throw "OpenOFC normal-flow v3 repair failed: $LASTEXITCODE" }
          python tools/apply_openofc_phase_flow_v4.py
          if ($LASTEXITCODE -ne 0) { throw "OpenOFC phase-flow v4 repair failed: $LASTEXITCODE" }
          python tools/apply_openofc_phase_flow_v41.py
          if ($LASTEXITCODE -ne 0) { throw "OpenOFC phase-flow v4.1 repair failed: $LASTEXITCODE" }
          python tools/apply_openofc_round_discard_exit_v42.py
          if ($LASTEXITCODE -ne 0) { throw "OpenOFC phase-flow v4.2 repair failed: $LASTEXITCODE" }
          python tools/apply_openofc_normal_completion_v43.py
          if ($LASTEXITCODE -ne 0) { throw "OpenOFC phase-flow v4.3 repair failed: $LASTEXITCODE" }
          python tools/apply_openofc_simultaneous_dealer_v44.py
          if ($LASTEXITCODE -ne 0) { throw "OpenOFC phase-flow v4.4 repair failed: $LASTEXITCODE" }

      - name: Assert v4.4 field contract
        shell: pwsh
        run: |
          $runtime = Get-Content -Raw 'OpenHoldem/COFCRuntimeController.cpp'
          $scraper = Get-Content -Raw 'OpenHoldem/COFCScraper.cpp'
          $recon = Get-Content -Raw 'OpenHoldem/COFCReconstructor.cpp'
          $planner = Get-Content -Raw 'OpenHoldem/COFCActionPlanner.cpp'
          $policy = Get-Content -Raw 'OpenHoldem/COFCBaselinePolicy.cpp'
          $selftest = Get-Content -Raw 'OpenHoldem/COFCBaselinePolicySelftest.cpp'
          $heartbeat = Get-Content -Raw 'OpenHoldem/CHeartbeatThread.cpp'

          if ($heartbeat -notmatch 'kOpenOFCContractVersion\s*=\s*4') { throw 'Runtime contract is not 4' }
          if ($scraper -notmatch 'OPENOFC_ROUND_FROM_BOARD_AND_CURRENT_V42') { throw 'v4.2 round inference missing' }
          if ($recon -notmatch 'OPENOFC_DERIVED_DISCARD_HISTORY_V42') { throw 'canonical discard derivation missing' }
          if ($scraper -notmatch 'OPENOFC_HERO_DISCARD_SCRAPE_DISABLED_V43') { throw 'Hero discard scrape disable missing' }
          if ($planner -notmatch 'LOOSE_GENERIC_X') { throw 'generic Joker source bridge missing' }
          if ($policy -notmatch 'OPENOFC_UNAVOIDABLE_FOUL_FALLBACK_V43') { throw 'unavoidable-foul fallback missing' }
          if ($selftest -notmatch 'UnavoidableFoulStillActs') { throw 'field foul selftest missing' }

          if ($scraper -notmatch 'OPENOFC_TURN_SEMANTICS_DISABLED_V44') { throw 'v4.4 turn-semantics marker missing' }
          if ($scraper -match 'region\.Format\("ofc_p%d_turn"') { throw 'normal runtime still scrapes per-player turn regions' }
          if ($runtime -notmatch 'OPENOFC_PREPARE_ON_CARDS_V44') { throw 'prepare-on-cards marker missing' }
          if ($runtime -match '&& state\.action_required && state\.hero_can_prepare') { throw 'action_required still gates arrangement readiness' }
          if ($runtime -match 'state\.acting_chair != state\.hero_chair \|\| !state\.hero_can_prepare') { throw 'Holdem actor gate survived v4.4' }
          if ($runtime -notmatch 'phase_ == kWaitingFinalInfo') { throw 'dealer provisional wait branch missing' }
          if ($runtime -notmatch 'opponent_final_info=1 reanalyze=1') { throw 'dealer final-information reanalysis missing' }
          if ($runtime -notmatch 'OPENOFC_NEW_HAND_RECOVERY_V44') { throw 'new-hand recovery edge missing' }
          if ($runtime -notmatch 'NEW_HAND_RECOVERY_EDGE') { throw 'new-hand recovery trace missing' }
          if ($runtime -notmatch 'policy=LEAVE_NEXT_HAND') { throw 'Leave Next Hand stop policy missing' }

      - name: Materialize TableMap v4.4 package copy
        shell: pwsh
        run: |
          $source = 'OpenOFC/TableMaps/KKPoker_OpenOFC_JokerUltimate_v4.tm.gz.b64'
          $canonical = 'OpenOFC/TableMaps/KKPoker_OpenOFC_JokerUltimate_v4_4.tm'
          $gz = 'OpenOFC/TableMaps/KKPoker_OpenOFC_JokerUltimate_v4_4.tm.gz'
          $bytes = [Convert]::FromBase64String((Get-Content -Raw $source).Trim())
          [IO.File]::WriteAllBytes($gz, $bytes)
          $input = [IO.File]::OpenRead($gz)
          try {
            $gzip = New-Object IO.Compression.GzipStream($input, [IO.Compression.CompressionMode]::Decompress)
            try {
              $output = [IO.File]::Create($canonical)
              try { $gzip.CopyTo($output) } finally { $output.Dispose() }
            } finally { $gzip.Dispose() }
          } finally { $input.Dispose() }
          Remove-Item $gz -Force

          $text = Get-Content -Raw $canonical
          $text = $text -replace 's\$openofc_safe_exit_calibrated\s+1', 's$openofc_safe_exit_calibrated 0'
          $text = $text -replace 's\$openofc_stop_enabled\s+0', 's$openofc_stop_enabled       1'
          $text = $text -replace 's\$openofc_stop_local_hhmm\s+0', 's$openofc_stop_local_hhmm    -1'
          if ($text -notmatch 's\$openofc_result_marker_calibrated') {
            $text = $text -replace 's\$openofc_phase_contract\s+1', "s`$openofc_phase_contract 1`r`ns`$openofc_result_marker_calibrated 0`r`ns`$openofc_field_revision 44`r`ns`$openofc_exit_mode_leave_next_hand 1`r`ns`$openofc_hero_discard_scrape 0`r`ns`$openofc_turn_semantics 0"
          } else {
            $text = $text -replace 's\$openofc_field_revision\s+\d+', 's$openofc_field_revision 44'
            if ($text -notmatch 's\$openofc_exit_mode_leave_next_hand') { $text += "`r`ns`$openofc_exit_mode_leave_next_hand 1`r`n" }
            if ($text -notmatch 's\$openofc_hero_discard_scrape') { $text += "s`$openofc_hero_discard_scrape 0`r`n" }
            if ($text -notmatch 's\$openofc_turn_semantics') { $text += "s`$openofc_turn_semantics 0`r`n" }
          }
          if ($text -notmatch 'r\$ofc_menu_button') { $text += "`r`nr`$ofc_menu_button 15 55 45 90 ff000000 0 N 1 0 0 0 -1`r`n" }
          if ($text -notmatch 'r\$ofc_leave_next_hand_menu_item') { $text += "r`$ofc_leave_next_hand_menu_item 12 252 237 306 ff000000 0 N 1 0 0 0 -1`r`n" }
          [IO.File]::WriteAllText((Resolve-Path $canonical), $text, (New-Object Text.UTF8Encoding($false)))

          python tools/validate_openofc_tablemap.py $canonical --require-contract 4
          if ($LASTEXITCODE -ne 0) { throw "TableMap v4.4 validation failed: $LASTEXITCODE" }
          $verify = Get-Content -Raw $canonical
          if ($verify -notmatch 's\$openofc_field_revision\s+44') { throw 'v4.4 field revision missing' }
          if ($verify -notmatch 's\$openofc_hero_discard_scrape\s+0') { throw 'discard-scrape-off marker missing' }
          if ($verify -notmatch 's\$openofc_turn_semantics\s+0') { throw 'turn-semantics-off marker missing' }
          if ($verify -notmatch 's\$openofc_stop_local_hhmm\s+-1') { throw 'default stop sentinel must be -1' }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Compile and run deterministic policy selftest
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $command = '"' + $devcmd + '" -arch=x86 -host_arch=x64 && cl /nologo /EHsc /O2 /MD /std:c++14 /DDEEPOFC_POLICY_STANDALONE /DDEEPOFC_TURNPLAN_STANDALONE /I OpenHoldem OpenHoldem\COFCBaselinePolicy.cpp OpenHoldem\COFCTurnPlan.cpp OpenHoldem\COFCBaselinePolicySelftest.cpp /Fe:COFCBaselinePolicySelftest.exe && COFCBaselinePolicySelftest.exe'
          cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw "Policy selftest failed: $LASTEXITCODE" }

      - name: Build dependency chain
        shell: pwsh
        run: |
          $root = (Resolve-Path '.').Path + '\'
          $common = @('/m','/t:Build','/p:Configuration=Release','/p:Platform=Win32',"/p:SolutionDir=$root",'/v:minimal')
          $projects = @(
            'DLLs/Files_DLL/Files.vcxproj',
            'DLLs/WindowFunctions_DLL/window_functions.vcxproj',
            'DLLs/StringFunctions_DLL/string_functions.vcxproj',
            'DLLs/Debug_DLL/Debug.vcxproj',
            'DLLs/Preferences_DLL/Preferences.vcxproj',
            'DLLs/Globals_DLL/globals.vcxproj',
            'DLLs/GamestateValidation_DLL/GamestateValidation.vcxproj',
            'DLLs/User_DLL/user.vcxproj',
            'PokerTracker_Query_Definitions/pokertracker_query_definitions.vcxproj',
            'Reference Mouse DLL/Reference Mouse DLL.vcxproj',
            'Reference Keyboard DLL/Reference Keyboard DLL.vcxproj'
          )
          foreach ($project in $projects) {
            & msbuild $project @common
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $project" }
          }

      - name: Build OpenHoldem Release Win32
        shell: pwsh
        run: |
          $root = (Resolve-Path '.').Path + '\'
          msbuild OpenHoldem/OpenHoldem.vcxproj /m /t:Build /p:Configuration=Release /p:Platform=Win32 "/p:SolutionDir=$root" /p:BuildProjectReferences=true /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "OpenHoldem Win32 build failed: $LASTEXITCODE" }

      - name: Collect runtime package
        shell: pwsh
        run: |
          $release = 'Release'
          $out = 'artifact/OpenOFC_PhaseFlow_v4_4_Windows'
          $canonical = 'OpenOFC/TableMaps/KKPoker_OpenOFC_JokerUltimate_v4_4.tm'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "$release/OpenHoldem.exe" $out
          Get-ChildItem $release -Filter '*.dll' | Copy-Item -Destination $out
          if (Test-Path "$release/tessdata") { Copy-Item "$release/tessdata" "$out/tessdata" -Recurse }
          $scraperOut = Join-Path $out 'scraper'
          New-Item -ItemType Directory -Force -Path $scraperOut | Out-Null
          Copy-Item $canonical (Join-Path $scraperOut 'KKPoker_OpenOFC_JokerUltimate_v4_4.tm')

          @'
          OpenOFC phase-flow v4.4

          Normal OFC arrangement authority is now card-driven, not turn-driven:
          - per-player turn regions are ignored by normal runtime semantics;
          - complete Hero incoming cards authorize immediate arrangement;
          - when Hero is not dealer, the decision can be finalized immediately;
          - when Hero is dealer and timer is still inactive, the runtime performs
            a provisional arrangement immediately and holds Confirm;
          - when the dealer timer/final opponent information becomes active, the
            runtime re-evaluates the now-visible opponent board, changes only what
            the new decision requires, and then confirms;
          - a fresh valid R0 resets stale WAIT_NEXT_3/WAIT_RESULT bookkeeping so
            an unfinished previous last round cannot poison later matches.

          v4.3 guarantees remain: Hero discard OCR disabled, Joker-X physical
          source bridge, unavoidable-foul completion fallback, Leave Next Hand.

          Fantasy implementation is intentionally staged separately in v5. The
          field-derived click-select + row-check contract is frozen in
          docs/OPENOFC_FANTASY_V5_EXECUTION_CONTRACT.md; v4.4 should not be used
          as evidence of Fantasy end-to-end readiness.

          Primary field acceptance target: observe dealer rounds log
          mode=PROVISIONAL while timer=0, physical arrangement before opponent
          finishes, then opponent_final_info=1 reanalyze=1 and Confirm.
          '@ | Set-Content -Encoding UTF8 "$out/README_OPENOFC.txt"

      - name: Upload Windows runtime
        uses: actions/upload-artifact@v4
        with:
          name: OpenOFC_PhaseFlow_v4_4_Windows
          path: artifact/OpenOFC_PhaseFlow_v4_4_Windows
          if-no-files-found: error
