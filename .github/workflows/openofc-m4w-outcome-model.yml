name: OpenOFC M4W continuation-outcome model gate

on:
  pull_request:
    paths:
      - 'tools/openofc_solver/m4w_outcome_model.py'
      - 'tools/openofc_solver/test_m4w_outcome_model.py'
      - 'tools/openofc_solver/M4W_OUTCOME_MODEL_CONTRACT.md'
      - '.github/workflows/openofc-m4w-outcome-model.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m4w-outcome-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Materialize certified Joker semantics
        run: python tools/openofc_solver/apply_m1b_joker_semantics.py

      - name: Validate continuation-independent outcome target plumbing
        run: |
          python tools/openofc_solver/test_m4w_outcome_model.py
          echo OPENOFC_M4W_GATE=PASS
