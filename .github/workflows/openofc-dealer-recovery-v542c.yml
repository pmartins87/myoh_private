name: OpenOFC v5.4.2C dealer recovery gate

on:
  push:
    branches:
      - 'openofc-v542c-dealer-recovery'
  pull_request:
    branches:
      - 'openofc-v542b-partial-reconnect'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-dealer-recovery:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply frozen v5.3 patch chain
        shell: pwsh
        run: |
          python -c "import tools.apply_openofc_runtime_repair as r; r.patch_transform(); r.patch_opponent_discards(); r.patch_capture(); print('OpenOFC runtime source repair applied successfully')"
          python tools/apply_openofc_log248_repair.py
          python tools/run_openofc_gameflow_v2.py
          python tools/apply_openofc_normal_flow_v3.py
          python tools/apply_openofc_phase_flow_v4.py
          python tools/apply_openofc_phase_flow_v41.py
          python tools/apply_openofc_round_discard_exit_v42.py
          python tools/apply_openofc_normal_completion_v43.py
          python tools/apply_openofc_simultaneous_dealer_v44.py
          python tools/run_openofc_fantasy_v5.py
          python tools/apply_openofc_opponent_history_v52.py
          python tools/run_openofc_smart_policy_v53.py
          if ($LASTEXITCODE -ne 0) { throw "OpenOFC frozen v5.3 chain failed: $LASTEXITCODE" }

      - name: Apply v5.4 never-terminal continuity patch
        shell: pwsh
        run: |
          python tools/run_openofc_runtime_continuity_v54.py
          if ($LASTEXITCODE -ne 0) { throw "OpenOFC v5.4 continuity patch failed: $LASTEXITCODE" }

      - name: Apply v5.4.2B partial reconnect patch
        shell: pwsh
        run: |
          python tools/apply_openofc_partial_reconnect_v542b.py
          if ($LASTEXITCODE -ne 0) { throw "OpenOFC v5.4.2B patch failed: $LASTEXITCODE" }

      - name: Apply v5.4.2C dealer recovery patch
        shell: pwsh
        run: |
          python tools/apply_openofc_dealer_recovery_v542c.py
          if ($LASTEXITCODE -ne 0) { throw "OpenOFC v5.4.2C dealer patch failed: $LASTEXITCODE" }
          python tools/normalize_openofc_dealer_recovery_v542c.py
          if ($LASTEXITCODE -ne 0) { throw "OpenOFC v5.4.2C normalization failed: $LASTEXITCODE" }

      - name: Assert v5.4.2C source contract
        shell: pwsh
        run: |
          $obs = Get-Content -Raw 'OpenHoldem/COFCVisualObservation.h'
          $state = Get-Content -Raw 'OpenHoldem/COFCState.h'
          $scraper = Get-Content -Raw 'OpenHoldem/COFCScraper.cpp'
          $reconstructor = Get-Content -Raw 'OpenHoldem/COFCReconstructor.cpp'
          $runtime = Get-Content -Raw 'OpenHoldem/COFCRuntimeController.cpp'
          $runtimeHeader = Get-Content -Raw 'OpenHoldem/COFCRuntimeController.h'
          $lazy = Get-Content -Raw 'OpenHoldem/CLazyScraper.cpp'

          foreach ($needle in @('OPENOFC_DEALER_RECOVERY_V542C','dealer_known')) {
            if (-not $obs.Contains($needle)) { throw "observation marker missing: $needle" }
          }
          foreach ($needle in @('dealer_known','dealer_carried','partial_turn_recovery')) {
            if (-not $state.Contains($needle)) { throw "state marker missing: $needle" }
          }
          foreach ($needle in @(
            '[OpenOFC DEALER_RAW]',
            'action=PROVISIONAL_ONLY',
            'OPENOFC_TURN_SEMANTICS_DISABLED_V44',
            'turn_semantics=IGNORED')) {
            if (-not $scraper.Contains($needle)) { throw "scraper marker missing: $needle" }
          }
          if ($scraper.Contains('Expected exactly one dealer; got dealer=%d')) {
            throw 'normal dealer-marker dropout still rejects raw state'
          }
          foreach ($needle in @(
            'previous->dealer_known && observation.dealer_known',
            'observation.dealer_known',
            'state.dealer_carried')) {
            if (-not $reconstructor.Contains($needle)) { throw "reconstructor marker missing: $needle" }
          }
          foreach ($needle in @(
            '[OpenOFC DEALER_CARRY_FORWARD]',
            '[OpenOFC DEALER_UNKNOWN_PROVISIONAL]',
            'OPENOFC_IDENTICAL_FAULT_RETRY_V541')) {
            if (-not $lazy.Contains($needle)) { throw "lazy-scraper marker missing: $needle" }
          }
          if ($runtime.Contains('kBlocked') -or $runtimeHeader.Contains('kBlocked')) {
            throw 'absorbing runtime kBlocked phase survived v5.4.2C'
          }
          Write-Host 'PASS: dealer marker count 0/2 is nonterminal normal-play uncertainty.'
          Write-Host 'PASS: normal actor turn markers remain outside action authority (v4.4).'
          Write-Host 'PASS: unknown dealer cannot authorize Confirm by -1 != Hero.'
          Write-Host 'FIELD_PACKAGE_AUTHORIZED=0'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Compile and run current-screen continuity regression
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $command = '"' + $devcmd + '" -arch=x86 -host_arch=x64 && cl /nologo /EHsc /O2 /MD /std:c++14 /DDEEPOFC_RECONSTRUCTOR_STANDALONE /I OpenHoldem OpenHoldem\COFCReconstructor.cpp OpenHoldem\COFCRuntimeContinuitySelftest.cpp /Fe:COFCRuntimeContinuitySelftest.exe && COFCRuntimeContinuitySelftest.exe'
          cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw "Continuity regression failed: $LASTEXITCODE" }

      - name: Compile and run partial reconnect regression
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $command = '"' + $devcmd + '" -arch=x86 -host_arch=x64 && cl /nologo /EHsc /O2 /MD /std:c++14 /DDEEPOFC_RECONSTRUCTOR_STANDALONE /DDEEPOFC_POLICY_STANDALONE /DDEEPOFC_TURNPLAN_STANDALONE /I OpenHoldem OpenHoldem\COFCReconstructor.cpp OpenHoldem\COFCBaselinePolicy.cpp OpenHoldem\COFCTurnPlan.cpp OpenHoldem\COFCPartialReconnectSelftest.cpp /Fe:COFCPartialReconnectSelftest.exe && COFCPartialReconnectSelftest.exe'
          cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw "Partial reconnect regression failed: $LASTEXITCODE" }

      - name: Compile and run dealer continuity selftest
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $command = '"' + $devcmd + '" -arch=x86 -host_arch=x64 && cl /nologo /EHsc /O2 /MD /std:c++14 /DDEEPOFC_RECONSTRUCTOR_STANDALONE /I OpenHoldem OpenHoldem\COFCReconstructor.cpp OpenHoldem\COFCDealerRecoverySelftest.cpp /Fe:COFCDealerRecoverySelftest.exe && COFCDealerRecoverySelftest.exe'
          cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw "Dealer continuity selftest failed: $LASTEXITCODE" }

      - name: Compile and run smart-policy regression
        shell: pwsh
        run: |
          python tools/instrument_openofc_policy_selftest_v54.py
          if ($LASTEXITCODE -ne 0) { throw "Policy selftest instrumentation failed: $LASTEXITCODE" }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $command = '"' + $devcmd + '" -arch=x86 -host_arch=x64 && cl /nologo /EHsc /O2 /MD /std:c++14 /DDEEPOFC_POLICY_STANDALONE /DDEEPOFC_TURNPLAN_STANDALONE /I OpenHoldem OpenHoldem\COFCBaselinePolicy.cpp OpenHoldem\COFCTurnPlan.cpp OpenHoldem\COFCBaselinePolicySelftest.cpp /Fe:COFCBaselinePolicySelftest.exe && COFCBaselinePolicySelftest.exe'
          cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw "Policy regression failed: $LASTEXITCODE" }

      - name: Build dependency chain
        shell: pwsh
        run: |
          $root = (Resolve-Path '.').Path + '\'
          $common = @('/m','/t:Build','/p:Configuration=Release','/p:Platform=Win32',"/p:SolutionDir=$root",'/v:minimal')
          $projects = @(
            'DLLs/Files_DLL/Files.vcxproj',
            'DLLs/WindowFunctions_DLL/window_functions.vcxproj',
            'DLLs/StringFunctions_DLL/string_functions.vcxproj',
            'DLLs/Debug_DLL/Debug.vcxproj',
            'DLLs/Preferences_DLL/Preferences.vcxproj',
            'DLLs/Globals_DLL/globals.vcxproj',
            'DLLs/GamestateValidation_DLL/GamestateValidation.vcxproj',
            'DLLs/User_DLL/user.vcxproj',
            'PokerTracker_Query_Definitions/pokertracker_query_definitions.vcxproj',
            'Reference Mouse DLL/Reference Mouse DLL.vcxproj',
            'Reference Keyboard DLL/Reference Keyboard DLL.vcxproj'
          )
          foreach ($project in $projects) {
            & msbuild $project @common
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $project" }
          }

      - name: Build OpenHoldem Release Win32
        shell: pwsh
        run: |
          $root = (Resolve-Path '.').Path + '\'
          msbuild OpenHoldem/OpenHoldem.vcxproj /m /t:Build /p:Configuration=Release /p:Platform=Win32 "/p:SolutionDir=$root" /p:BuildProjectReferences=true /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "OpenHoldem Win32 build failed: $LASTEXITCODE" }

      - name: Freeze v5.4.2C gate result
        shell: pwsh
        run: |
          Write-Host 'OpenOFC v5.4.2C dealer/actor continuity gate completed.'
          Write-Host 'Normal dealer marker 0/2 no longer invalidates otherwise coherent card state.'
          Write-Host 'Fresh unknown dealer can arrange provisionally but cannot Confirm without timer/exact finalization proof.'
          Write-Host 'Prior exact dealer may be carried only inside same-hand canonical lineage and is explicitly tagged.'
          Write-Host 'Normal actor marker loss is already non-authoritative under v4.4 cards-available semantics.'
          Write-Host 'Contradictory exact dealer identities remain fail-closed.'
          Write-Host 'Native generic Fantasy pixel routing remains v5.4.3.'
          Write-Host 'No runtime ZIP is uploaded by this workflow.'
          Write-Host 'FIELD_PACKAGE_AUTHORIZED=0'
