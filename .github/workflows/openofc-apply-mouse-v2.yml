name: OpenOFC apply mouse v2

on:
  push:
    branches:
      - agent/openofc-foundation
    paths:
      - 'tools/apply_openofc_mouse_v2.py'
      - '.github/workflows/openofc-apply-mouse-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/openofc-foundation
          fetch-depth: 0

      - name: Apply mouse v2 repair
        run: python tools/apply_openofc_mouse_v2.py

      - name: Commit materialized source
        shell: bash
        run: |
          git config user.name "OpenOFC automation"
          git config user.email "actions@users.noreply.github.com"
          git add OpenHoldem/CCasinoInterface.cpp "Reference Mouse DLL/mousedll.cpp" OpenHoldem/COFCRuntimeController.h OpenHoldem/COFCRuntimeController.cpp OpenHoldem/OpenHoldemView.cpp .github/workflows/deepofc-fp0-playable-fantasy15.yml
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "OpenOFC: restore legacy mouse arbitration and bound drag retries"
          git push origin HEAD:agent/openofc-foundation
