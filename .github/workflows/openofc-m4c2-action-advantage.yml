name: OpenOFC M4C2 bounded action-advantage generalization gate

on:
  pull_request:
    paths:
      - 'tools/openofc_solver/**'
      - '.github/workflows/openofc-m4c2-action-advantage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m4c2-action-advantage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Materialize certified Joker semantics
        run: python tools/openofc_solver/apply_m1b_joker_semantics.py

      - name: Revalidate exact strategic information contract
        run: |
          python tools/openofc_solver/test_strategic_cfr.py
          python tools/openofc_solver/test_strategic_suit_symmetry.py
          python tools/openofc_solver/test_strategic_feature_encoder.py

      - name: Validate bounded action-conditioned model and held-out distillation
        run: python tools/openofc_solver/test_strategic_advantage_model.py

      - name: Revalidate continuation-coupled objective
        run: python tools/openofc_solver/test_strategic_continuation_cfr.py
