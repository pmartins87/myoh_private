name: OpenOFC M5F Fantasy held-out evidence gate

on:
  push:
    branches:
      - 'openofc-m4v-continuation-transport'
    paths:
      - 'tools/openofc_solver/m5f_fantasy_heldout_evidence.py'
      - 'tools/openofc_solver/test_m5f_fantasy_heldout_evidence.py'
      - 'tools/openofc_solver/M5F_FANTASY_HELDOUT_EVIDENCE_CONTRACT.md'
      - '.github/workflows/openofc-m5f-fantasy-heldout-evidence.yml'
  pull_request:
    paths:
      - 'tools/openofc_solver/m5f_fantasy_heldout_evidence.py'
      - 'tools/openofc_solver/test_m5f_fantasy_heldout_evidence.py'
      - 'tools/openofc_solver/M5F_FANTASY_HELDOUT_EVIDENCE_CONTRACT.md'
      - '.github/workflows/openofc-m5f-fantasy-heldout-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m5f-fantasy-heldout-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Materialize certified Joker semantics
        run: python tools/openofc_solver/apply_m1b_joker_semantics.py

      - name: Validate held-out Fantasy evidence pipeline
        run: |
          cd tools/openofc_solver
          python test_m5f_fantasy_heldout_evidence.py
