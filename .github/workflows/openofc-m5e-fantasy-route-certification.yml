name: OpenOFC M5E Fantasy route certification gate

on:
  push:
    branches:
      - 'openofc-m4v-continuation-transport'
    paths:
      - 'tools/openofc_solver/m5e_fantasy_route_certification.py'
      - 'tools/openofc_solver/test_m5e_fantasy_route_certification.py'
      - 'tools/openofc_solver/M5E_FANTASY_ROUTE_CERTIFICATION_CONTRACT.md'
      - '.github/workflows/openofc-m5e-fantasy-route-certification.yml'
  pull_request:
    paths:
      - 'tools/openofc_solver/m5e_fantasy_route_certification.py'
      - 'tools/openofc_solver/test_m5e_fantasy_route_certification.py'
      - 'tools/openofc_solver/M5E_FANTASY_ROUTE_CERTIFICATION_CONTRACT.md'
      - '.github/workflows/openofc-m5e-fantasy-route-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m5e-fantasy-route-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Materialize certified Joker semantics
        run: python tools/openofc_solver/apply_m1b_joker_semantics.py

      - name: Validate fail-closed Fantasy route certification
        run: |
          cd tools/openofc_solver
          python test_m5e_fantasy_route_certification.py
