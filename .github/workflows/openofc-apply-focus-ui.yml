name: OpenOFC apply focus UI repair

on:
  push:
    branches:
      - agent/openofc-foundation
    paths:
      - 'tools/apply_openofc_focus_ui_repair.py'
      - '.github/workflows/openofc-apply-focus-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/openofc-foundation
          fetch-depth: 0

      - name: Apply repair to source
        run: python tools/apply_openofc_focus_ui_repair.py

      - name: Commit materialized source
        shell: bash
        run: |
          git config user.name "OpenOFC automation"
          git config user.email "actions@users.noreply.github.com"
          git add OpenHoldem/CCasinoInterface.cpp OpenHoldem/OpenHoldemView.cpp
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "OpenOFC: recover simulator focus and replace Holdem main view"
          git push origin HEAD:agent/openofc-foundation
