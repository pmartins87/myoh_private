name: DeepOFC R9 Windows build gate

on:
  push:
    branches: [deepofc]
    paths:
      - '.github/workflows/deepofc-r9-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-persist-project-entry:
    runs-on: windows-2022
    steps:
      - name: Checkout deepofc
        uses: actions/checkout@v4
        with:
          ref: deepofc
          fetch-depth: 0

      - name: Ensure DeepOFC compilation units are in the project
        shell: pwsh
        run: |
          $path = 'OpenHoldem/OpenHoldem.vcxproj'
          $text = Get-Content -Raw -Encoding UTF8 $path
          $utf8 = New-Object System.Text.UTF8Encoding($false)

          if ($text -notmatch 'ClCompile Include="COFCScraper\.cpp"') {
            $needle = '    <ClCompile Include="CScraper.cpp" />'
            if (-not $text.Contains($needle)) { throw 'Could not find CScraper.cpp project entry' }
            $text = $text.Replace($needle, $needle + "`r`n" + '    <ClCompile Include="COFCScraper.cpp" />')
          }
          if ($text -notmatch 'ClCompile Include="COFCReconstructor\.cpp"') {
            $needle = '    <ClCompile Include="COFCScraper.cpp" />'
            if (-not $text.Contains($needle)) { throw 'Could not find COFCScraper.cpp project entry' }
            $text = $text.Replace($needle, $needle + "`r`n" + '    <ClCompile Include="COFCReconstructor.cpp" />')
          }
          [System.IO.File]::WriteAllText((Resolve-Path $path), $text, $utf8)
          Select-String -Path $path -Pattern 'COFC(Scraper|Reconstructor)\.cpp'

      - name: Apply canonical reconstruction integration
        shell: pwsh
        run: |
          $utf8 = New-Object System.Text.UTF8Encoding($false)

          $reconPath = 'OpenHoldem/COFCReconstructor.cpp'
          $recon = Get-Content -Raw -Encoding UTF8 $reconPath
          $reconEol = if ($recon.Contains("`r`n")) { "`r`n" } else { "`n" }

          # The native replay self-test compiles this pure-state unit without the
          # legacy MFC precompiled header; the OpenHoldem project keeps StdAfx.
          if ($recon -notmatch 'DEEPOFC_RECONSTRUCTOR_STANDALONE') {
            $needle = '#include "StdAfx.h"' + $reconEol + '#include "COFCReconstructor.h"'
            if (-not $recon.Contains($needle)) { throw 'Could not find reconstructor include preamble' }
            $replacement = @(
              '#ifndef DEEPOFC_RECONSTRUCTOR_STANDALONE',
              '#include "StdAfx.h"',
              '#endif',
              '#include "COFCReconstructor.h"'
            ) -join $reconEol
            $recon = $recon.Replace($needle, $replacement)
          }

          # Fix a temporary-set iterator expression from the initial draft.
          $old = '  if (KnownBoardSet(visual).find(value) != KnownBoardSet(visual).end()) return true;'
          $new = '  set<int> visual_cards = KnownBoardSet(visual);' + $reconEol + '  if (visual_cards.find(value) != visual_cards.end()) return true;'
          if ($recon.Contains($old)) {
            $recon = $recon.Replace($old, $new)
          }
          [System.IO.File]::WriteAllText((Resolve-Path $reconPath), $recon, $utf8)

          $lazyPath = 'OpenHoldem/CLazyScraper.cpp'
          $lazy = Get-Content -Raw -Encoding UTF8 $lazyPath
          $eol = if ($lazy.Contains("`r`n")) { "`r`n" } else { "`n" }

          if ($lazy -notmatch '#include "COFCReconstructor\.h"') {
            $needle = '#include "CScraper.h"' + $eol
            if (-not $lazy.Contains($needle)) { throw 'Could not find CScraper include' }
            $lazy = $lazy.Replace($needle, '#include "COFCReconstructor.h"' + $eol + $needle)
          }

          if ($lazy -notmatch 'DeepOFC R9 canonical reconstruction path') {
            $pattern = '(?s)  // DeepOFC R9 read-only scrape path:.*?  if \(p_tablemap->SupportsOFCJokerUltimate\(\)\) \{.*?\r?\n  \}\r?\n\tp_scraper->ScrapeLimits\(\);'
            $replacementLines = @(
              '  // DeepOFC R9 canonical reconstruction path. Joker Ultimate never falls',
              '  // through to legacy Hold''em hole/community/betting semantics.',
              '  if (p_tablemap->SupportsOFCJokerUltimate()) {',
              '    COFCState previous_state = *p_table_state->OFCState();',
              '    if (!p_scraper->ScrapeOFCVisualObservation()) {',
              '      p_table_state->OFCState()->Reset();',
              '      write_log(k_always_log_errors,',
              '        "[DeepOFC] R9 raw OFC scrape rejected; canonical state invalid\n");',
              '      return;',
              '    }',
              '',
              '    const COFCVisualObservation *raw = p_table_state->OFCVisualObservation();',
              '    // A backwards transition to round 0 is an unambiguous new normal hand.',
              '    // Do not carry the prior hand''s canonical state into it.',
              '    const COFCState *previous = previous_state.valid ? &previous_state : NULL;',
              '    if (raw->round_index == 0 && previous_state.valid && previous_state.round_index > 0) {',
              '      previous = NULL;',
              '    }',
              '',
              '    COFCState rebuilt;',
              '    std::string reconstruction_error;',
              '    if (!COFCReconstructor::Reconstruct(',
              '          *raw, previous, &rebuilt, &reconstruction_error)) {',
              '      p_table_state->OFCState()->Reset();',
              '      write_log(k_always_log_errors,',
              '        "[DeepOFC] canonical reconstruction rejected: %s\n",',
              '        reconstruction_error.c_str());',
              '      return;',
              '    }',
              '',
              '    *p_table_state->OFCState() = rebuilt;',
              '    std::string snapshot = COFCReconstructor::DiagnosticSnapshot(rebuilt);',
              '    write_log(true, "[DeepOFC SNAPSHOT v1] %s\n", snapshot.c_str());',
              '    return;',
              '  }',
              "`tp_scraper->ScrapeLimits();"
            )
            $replacement = $replacementLines -join $eol
            $newLazy = [regex]::Replace($lazy, $pattern, $replacement, 1)
            if ($newLazy -eq $lazy) { throw 'Could not replace existing DeepOFC heartbeat block' }
            $lazy = $newLazy
          }
          [System.IO.File]::WriteAllText((Resolve-Path $lazyPath), $lazy, $utf8)
          Select-String -Path $lazyPath -Pattern 'DeepOFC R9 canonical reconstruction path|DeepOFC SNAPSHOT v1'

      - name: Checkout independent DeepOFC reference
        uses: actions/checkout@v4
        with:
          repository: pmartins87/DeepOFC
          ref: main
          path: _deepofc_reference
          persist-credentials: false

      - name: Export independent seven-frame replay reference
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path '_deepofc_reference').Path
          python _deepofc_reference/tools/export_openholdem_replay_reference.py --out _deepofc_reference/openholdem_replay_reference_v1.txt
          Get-Content _deepofc_reference/openholdem_replay_reference_v1.txt -TotalCount 5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show toolchain evidence
        shell: pwsh
        run: |
          msbuild -version
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.ATLMFC -property installationPath
          if (-not $vs) { throw 'VC ATL/MFC component not found on runner' }
          Write-Host "ATL/MFC Visual Studio installation: $vs"

      - name: Compile and run native cross-language canonical replay gate
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          if (-not $vs) { throw 'Visual Studio installation not found' }
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $command = '"' + $devcmd + '" -arch=x86 -host_arch=x64 && cl /nologo /EHsc /std:c++14 /DDEEPOFC_RECONSTRUCTOR_STANDALONE OpenHoldem\COFCReconstructor.cpp OpenHoldem\COFCReconstructorSelftest.cpp /Fe:COFCReconstructorSelftest.exe && COFCReconstructorSelftest.exe _deepofc_reference\openholdem_replay_reference_v1.txt'
          cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw "Native canonical replay gate failed with exit code $LASTEXITCODE" }

      - name: Build native dependency chain
        shell: pwsh
        run: |
          $root = (Resolve-Path '.').Path + '\'
          $common = @('/m','/t:Build','/p:Configuration=Release','/p:Platform=Win32',"/p:SolutionDir=$root",'/v:minimal')
          $projects = @(
            'DLLs/Files_DLL/Files.vcxproj',
            'DLLs/WindowFunctions_DLL/window_functions.vcxproj',
            'DLLs/StringFunctions_DLL/string_functions.vcxproj',
            'DLLs/Debug_DLL/Debug.vcxproj',
            'DLLs/Preferences_DLL/Preferences.vcxproj',
            'DLLs/Globals_DLL/globals.vcxproj',
            'DLLs/GamestateValidation_DLL/GamestateValidation.vcxproj',
            'DLLs/User_DLL/user.vcxproj',
            'PokerTracker_Query_Definitions/pokertracker_query_definitions.vcxproj'
          )
          foreach ($project in $projects) {
            Write-Host "=== BUILD $project ==="
            & msbuild $project @common
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $project" }
          }

      - name: Assert OpenHoldem link inputs
        shell: pwsh
        run: |
          $required = @(
            'Preferences.lib','globals.lib','pokertracker_query_definitions.lib',
            'Reference User DLL.lib','window_functions.lib','string_functions.lib',
            'debug.lib','GameStateValidation.lib','files.lib'
          )
          foreach ($name in $required) {
            $path = Join-Path 'Release' $name
            if (-not (Test-Path $path)) { throw "Missing required OpenHoldem link input: $path" }
          }

      - name: Build OpenHoldem Release Win32
        shell: pwsh
        run: |
          $root = (Resolve-Path '.').Path + '\'
          msbuild OpenHoldem/OpenHoldem.vcxproj /m /t:Build /p:Configuration=Release /p:Platform=Win32 "/p:SolutionDir=$root" /p:BuildProjectReferences=true /v:minimal

      - name: Assert hard R9 read-only guard survived integration
        shell: pwsh
        run: |
          $guard = Select-String -Path 'OpenHoldem/CAutoplayer.cpp' -Pattern 'DeepOFC R9 hard read-only guard' -Quiet
          if (-not $guard) { throw 'R9 autoplayer guard missing' }

      - name: Persist validated canonical integration only after successful gates
        shell: pwsh
        run: |
          $paths = @(
            'OpenHoldem/OpenHoldem.vcxproj',
            'OpenHoldem/COFCReconstructor.cpp',
            'OpenHoldem/CLazyScraper.cpp'
          )
          $changed = git diff --name-only -- $paths
          if (-not $changed) {
            Write-Host 'Validated canonical integration already persisted.'
            exit 0
          }
          git config user.name 'DeepOFC Build Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add -- $paths
          git commit -m 'DeepOFC R9: wire and replay-validate canonical reconstruction'
          git push origin HEAD:deepofc
