name: DeepOFC R9 Windows build gate

on:
  push:
    branches: [deepofc]
    paths:
      - '.github/workflows/deepofc-r9-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-persist-project-entry:
    # windows-2022 is intentional: the OpenHoldem tree targets v143 and this
    # image contains the ATL/MFC component required by the native projects.
    runs-on: windows-2022
    steps:
      - name: Checkout deepofc
        uses: actions/checkout@v4
        with:
          ref: deepofc
          fetch-depth: 0

      - name: Ensure COFCScraper compilation unit is in the project
        shell: pwsh
        run: |
          $path = 'OpenHoldem/OpenHoldem.vcxproj'
          $text = Get-Content -Raw -Encoding UTF8 $path
          if ($text -notmatch 'ClCompile Include="COFCScraper\.cpp"') {
            $needle = '    <ClCompile Include="CScraper.cpp" />'
            if (-not $text.Contains($needle)) {
              throw "Could not find CScraper.cpp project entry"
            }
            $replacement = $needle + "`r`n" + '    <ClCompile Include="COFCScraper.cpp" />'
            $text = $text.Replace($needle, $replacement)
            [System.IO.File]::WriteAllText((Resolve-Path $path), $text, (New-Object System.Text.UTF8Encoding($false)))
          }
          Select-String -Path $path -Pattern 'COFCScraper.cpp'

      - name: Inject R9 isolated heartbeat and hard read-only guard
        shell: pwsh
        run: |
          $utf8 = New-Object System.Text.UTF8Encoding($false)

          $lazyPath = 'OpenHoldem/CLazyScraper.cpp'
          $lazy = Get-Content -Raw -Encoding UTF8 $lazyPath
          if ($lazy -notmatch 'DeepOFC R9 read-only scrape path') {
            $needle = "  _is_identical_scrape = false;`r`n`t p_scraper->ScrapeLimits();".Replace("`t ","`t")
            if (-not $lazy.Contains($needle)) {
              $needle = "  _is_identical_scrape = false;`n`t p_scraper->ScrapeLimits();".Replace("`t ","`t")
            }
            if (-not $lazy.Contains($needle)) {
              $needle = "  _is_identical_scrape = false;`r`n`t p_scraper->ScrapeLimits();".Replace(" p_scraper","p_scraper")
            }
            if (-not $lazy.Contains($needle)) {
              $needle = "  _is_identical_scrape = false;`n`t p_scraper->ScrapeLimits();".Replace(" p_scraper","p_scraper")
            }
            if (-not $lazy.Contains($needle)) {
              throw 'Could not find CLazyScraper insertion point'
            }
            $eol = if ($lazy.Contains("`r`n")) { "`r`n" } else { "`n" }
            $replacement = @(
              '  _is_identical_scrape = false;',
              '  // DeepOFC R9 read-only scrape path: an explicit Joker Ultimate',
              '  // tablemap must never fall through to Hold''em hole/community/betting semantics.',
              '  if (p_tablemap->SupportsOFCJokerUltimate()) {',
              '    // Canonical reconstruction is added separately; until then never leave',
              '    // an old canonical OFC state live beside a new raw observation.',
              '    p_table_state->OFCState()->Reset();',
              '    if (!p_scraper->ScrapeOFCVisualObservation()) {',
              '      write_log(k_always_log_errors,',
              '        "[DeepOFC] R9 raw OFC scrape rejected; state remains invalid\n");',
              '    }',
              '    return;',
              '  }',
              "`tp_scraper->ScrapeLimits();"
            ) -join $eol
            $lazy = $lazy.Replace($needle, $replacement)
            [System.IO.File]::WriteAllText((Resolve-Path $lazyPath), $lazy, $utf8)
          }
          Select-String -Path $lazyPath -Pattern 'DeepOFC R9 read-only scrape path'

          $autoPath = 'OpenHoldem/CAutoplayer.cpp'
          $auto = Get-Content -Raw -Encoding UTF8 $autoPath
          if ($auto -notmatch 'DeepOFC R9 hard read-only guard') {
            $eol = if ($auto.Contains("`r`n")) { "`r`n" } else { "`n" }
            $needle = 'void CAutoplayer::DoAutoplayer(void) {' + $eol
            if (-not $auto.Contains($needle)) {
              throw 'Could not find CAutoplayer::DoAutoplayer insertion point'
            }
            $replacement = @(
              'void CAutoplayer::DoAutoplayer(void) {',
              '  // DeepOFC R9 hard read-only guard. No popup, hopper, formula,',
              '  // mouse or keyboard action is allowed on a Joker Ultimate table yet.',
              '  if (p_tablemap->SupportsOFCJokerUltimate()) {',
              '    write_log(true, "[DeepOFC] R9 hard read-only guard: autoplayer suppressed\n");',
              '    action_sequence_needs_to_be_finished = false;',
              '    return;',
              '  }'
            ) -join $eol
            $replacement += $eol
            $auto = $auto.Replace($needle, $replacement)
            [System.IO.File]::WriteAllText((Resolve-Path $autoPath), $auto, $utf8)
          }
          Select-String -Path $autoPath -Pattern 'DeepOFC R9 hard read-only guard'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show toolchain evidence
        shell: pwsh
        run: |
          msbuild -version
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.ATLMFC -property installationPath
          if (-not $vs) { throw 'VC ATL/MFC component not found on runner' }
          Write-Host "ATL/MFC Visual Studio installation: $vs"

      - name: Build native dependency chain
        shell: pwsh
        run: |
          $root = (Resolve-Path '.').Path + '\'
          $common = @('/m','/t:Build','/p:Configuration=Release','/p:Platform=Win32',"/p:SolutionDir=$root",'/v:minimal')
          $projects = @(
            'DLLs/Files_DLL/Files.vcxproj',
            'DLLs/WindowFunctions_DLL/window_functions.vcxproj',
            'DLLs/StringFunctions_DLL/string_functions.vcxproj',
            'DLLs/Debug_DLL/Debug.vcxproj',
            'DLLs/Preferences_DLL/Preferences.vcxproj',
            'DLLs/Globals_DLL/globals.vcxproj',
            'DLLs/GamestateValidation_DLL/GamestateValidation.vcxproj',
            'DLLs/User_DLL/user.vcxproj',
            'PokerTracker_Query_Definitions/pokertracker_query_definitions.vcxproj'
          )
          foreach ($project in $projects) {
            Write-Host "=== BUILD $project ==="
            & msbuild $project @common
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $project" }
          }

      - name: Assert OpenHoldem link inputs
        shell: pwsh
        run: |
          $required = @(
            'Preferences.lib','globals.lib','pokertracker_query_definitions.lib',
            'Reference User DLL.lib','window_functions.lib','string_functions.lib',
            'debug.lib','GameStateValidation.lib','files.lib'
          )
          foreach ($name in $required) {
            $path = Join-Path 'Release' $name
            if (-not (Test-Path $path)) { throw "Missing required OpenHoldem link input: $path" }
            Write-Host "FOUND $path"
          }

      - name: Build OpenHoldem Release Win32
        shell: pwsh
        run: |
          $root = (Resolve-Path '.').Path + '\'
          msbuild OpenHoldem/OpenHoldem.vcxproj /m /t:Build /p:Configuration=Release /p:Platform=Win32 "/p:SolutionDir=$root" /p:BuildProjectReferences=true /v:minimal

      - name: Persist validated R9 integration only after successful build
        shell: pwsh
        run: |
          $paths = @('OpenHoldem/OpenHoldem.vcxproj','OpenHoldem/CLazyScraper.cpp','OpenHoldem/CAutoplayer.cpp')
          $changed = git diff --name-only -- $paths
          if (-not $changed) {
            Write-Host 'Validated R9 integration is already persisted; nothing to commit.'
            exit 0
          }
          git config user.name 'DeepOFC Build Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add -- $paths
          git commit -m 'DeepOFC R9: isolate OFC heartbeat behind read-only guard'
          git push origin HEAD:deepofc
