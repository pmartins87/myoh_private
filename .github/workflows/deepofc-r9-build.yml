name: DeepOFC R9 Windows build gate

on:
  push:
    branches: [deepofc]
    paths:
      - '.github/workflows/deepofc-r9-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-persist-project-entry:
    # windows-2022 is intentional: the OpenHoldem project targets v143 and
    # GitHub's image includes the VC ATL/MFC component required by this tree.
    runs-on: windows-2022
    steps:
      - name: Checkout deepofc
        uses: actions/checkout@v4
        with:
          ref: deepofc
          fetch-depth: 0

      - name: Inject COFCScraper compilation unit for the build gate
        shell: pwsh
        run: |
          $path = 'OpenHoldem/OpenHoldem.vcxproj'
          $text = Get-Content -Raw -Encoding UTF8 $path
          if ($text -notmatch 'ClCompile Include="COFCScraper\.cpp"') {
            $needle = '    <ClCompile Include="CScraper.cpp" />'
            if (-not $text.Contains($needle)) {
              throw "Could not find CScraper.cpp project entry"
            }
            $replacement = $needle + "`r`n" + '    <ClCompile Include="COFCScraper.cpp" />'
            $text = $text.Replace($needle, $replacement)
            [System.IO.File]::WriteAllText((Resolve-Path $path), $text, (New-Object System.Text.UTF8Encoding($false)))
          }
          Select-String -Path $path -Pattern 'COFCScraper.cpp'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show toolchain evidence
        shell: pwsh
        run: |
          msbuild -version
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.ATLMFC -property installationPath
          if (-not $vs) { throw 'VC ATL/MFC component not found on runner' }
          Write-Host "ATL/MFC Visual Studio installation: $vs"

      - name: Build OpenHoldem Release Win32
        shell: pwsh
        run: |
          # Build the actual OpenHoldem project and its project references, not
          # unrelated legacy C# utilities in the full solution that target .NET 4.5.
          msbuild OpenHoldem/OpenHoldem.vcxproj /m /t:Build /p:Configuration=Release /p:Platform=Win32 /p:BuildProjectReferences=true /v:minimal

      - name: Persist project entry only after successful build
        shell: pwsh
        run: |
          if (git diff --quiet -- OpenHoldem/OpenHoldem.vcxproj) {
            Write-Host 'Project entry already persisted; nothing to commit.'
            exit 0
          }
          git config user.name 'DeepOFC Build Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add OpenHoldem/OpenHoldem.vcxproj
          git commit -m 'DeepOFC R9: compile COFCScraper in OpenHoldem project'
          git push origin HEAD:deepofc
