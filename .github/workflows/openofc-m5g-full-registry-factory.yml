name: OpenOFC M5G full certified registry factory gate

on:
  push:
    branches:
      - 'openofc-m4v-continuation-transport'
    paths:
      - 'tools/openofc_solver/m5g_full_registry_factory.py'
      - 'tools/openofc_solver/test_m5g_full_registry_factory.py'
      - 'tools/openofc_solver/M5G_FULL_REGISTRY_FACTORY_CONTRACT.md'
      - '.github/workflows/openofc-m5g-full-registry-factory.yml'
  pull_request:
    paths:
      - 'tools/openofc_solver/m5g_full_registry_factory.py'
      - 'tools/openofc_solver/test_m5g_full_registry_factory.py'
      - 'tools/openofc_solver/M5G_FULL_REGISTRY_FACTORY_CONTRACT.md'
      - '.github/workflows/openofc-m5g-full-registry-factory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m5g-full-registry-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Materialize certified Joker semantics
        run: python tools/openofc_solver/apply_m1b_joker_semantics.py

      - name: Validate complete exact-V registry assembly
        run: |
          cd tools/openofc_solver
          python test_m5g_full_registry_factory.py
