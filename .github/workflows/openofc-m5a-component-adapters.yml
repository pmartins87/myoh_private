name: OpenOFC M5A three-kernel component adapters gate

on:
  push:
    branches:
      - 'openofc-m4v-continuation-transport'
    paths:
      - 'tools/openofc_solver/m5a_normal_normal_oracle.py'
      - 'tools/openofc_solver/m5a_normal_fantasy_oracle.py'
      - 'tools/openofc_solver/m5a_fantasy_fantasy_oracle.py'
      - 'tools/openofc_solver/normal_fantasy_policy_features.py'
      - 'tools/openofc_solver/normal_fantasy_policy_distillation.py'
      - 'tools/openofc_solver/test_m5a_normal_fantasy_oracle.py'
      - 'tools/openofc_solver/test_m5a_component_adapters.py'
      - 'tools/openofc_solver/M5A_NORMAL_FANTASY_ORACLE_CONTRACT.md'
      - '.github/workflows/openofc-m5a-component-adapters.yml'
  pull_request:
    paths:
      - 'tools/openofc_solver/m5a_normal_normal_oracle.py'
      - 'tools/openofc_solver/m5a_normal_fantasy_oracle.py'
      - 'tools/openofc_solver/m5a_fantasy_fantasy_oracle.py'
      - 'tools/openofc_solver/normal_fantasy_policy_features.py'
      - 'tools/openofc_solver/normal_fantasy_policy_distillation.py'
      - 'tools/openofc_solver/test_m5a_normal_fantasy_oracle.py'
      - 'tools/openofc_solver/test_m5a_component_adapters.py'
      - 'tools/openofc_solver/M5A_NORMAL_FANTASY_ORACLE_CONTRACT.md'
      - '.github/workflows/openofc-m5a-component-adapters.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m5a-component-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install terminal-model dependency
        run: python -m pip install numpy

      - name: Materialize certified Joker semantics
        run: python tools/openofc_solver/apply_m1b_joker_semantics.py

      - name: Validate asymmetric visible-policy adapter
        run: |
          cd tools/openofc_solver
          python test_m5a_normal_fantasy_oracle.py

      - name: Validate all three M5A component boundaries
        run: |
          cd tools/openofc_solver
          python test_m5a_component_adapters.py
