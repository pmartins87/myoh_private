name: OpenOFC v5.4.7 authoritative PR gate

on:
  pull_request:
    branches:
      - 'openofc-v543-field-resilience'

permissions:
  contents: read

jobs:
  v547-authoritative:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout PR merge
        uses: actions/checkout@v4

      - name: Apply frozen v5.3 chain
        shell: pwsh
        run: |
          python -c "import tools.apply_openofc_runtime_repair as r; r.patch_transform(); r.patch_opponent_discards(); r.patch_capture(); print('OpenOFC runtime source repair applied successfully')"
          if ($LASTEXITCODE -ne 0) { throw "runtime repair failed: $LASTEXITCODE" }
          python tools/apply_openofc_log248_repair.py
          if ($LASTEXITCODE -ne 0) { throw "log248 repair failed: $LASTEXITCODE" }
          python tools/run_openofc_gameflow_v2.py
          if ($LASTEXITCODE -ne 0) { throw "gameflow v2 failed: $LASTEXITCODE" }
          python tools/apply_openofc_normal_flow_v3.py
          if ($LASTEXITCODE -ne 0) { throw "normal flow v3 failed: $LASTEXITCODE" }
          python tools/apply_openofc_phase_flow_v4.py
          if ($LASTEXITCODE -ne 0) { throw "phase flow v4 failed: $LASTEXITCODE" }
          python tools/apply_openofc_phase_flow_v41.py
          if ($LASTEXITCODE -ne 0) { throw "phase flow v4.1 failed: $LASTEXITCODE" }
          python tools/apply_openofc_round_discard_exit_v42.py
          if ($LASTEXITCODE -ne 0) { throw "round/discard v4.2 failed: $LASTEXITCODE" }
          python tools/apply_openofc_normal_completion_v43.py
          if ($LASTEXITCODE -ne 0) { throw "normal completion v4.3 failed: $LASTEXITCODE" }
          python tools/apply_openofc_simultaneous_dealer_v44.py
          if ($LASTEXITCODE -ne 0) { throw "dealer v4.4 failed: $LASTEXITCODE" }
          python tools/run_openofc_fantasy_v5.py
          if ($LASTEXITCODE -ne 0) { throw "Fantasy v5 failed: $LASTEXITCODE" }
          python tools/apply_openofc_opponent_history_v52.py
          if ($LASTEXITCODE -ne 0) { throw "opponent history v5.2 failed: $LASTEXITCODE" }
          python tools/run_openofc_smart_policy_v53.py
          if ($LASTEXITCODE -ne 0) { throw "smart baseline v5.3 failed: $LASTEXITCODE" }
          Write-Host 'V53_MATERIALIZATION=PASS'

      - name: Apply v5.4 through v5.4.7
        shell: pwsh
        run: |
          python tools/run_openofc_runtime_continuity_v54.py
          if ($LASTEXITCODE -ne 0) { throw "v5.4 continuity failed: $LASTEXITCODE" }
          python tools/apply_openofc_partial_reconnect_v542b.py
          if ($LASTEXITCODE -ne 0) { throw "v5.4.2B failed: $LASTEXITCODE" }
          python tools/apply_openofc_dealer_recovery_v542c.py
          if ($LASTEXITCODE -ne 0) { throw "v5.4.2C failed: $LASTEXITCODE" }
          python tools/normalize_openofc_dealer_recovery_v542c.py
          if ($LASTEXITCODE -ne 0) { throw "v5.4.2C normalization failed: $LASTEXITCODE" }
          python tools/run_openofc_generic_fantasy_v543.py
          if ($LASTEXITCODE -ne 0) { throw "v5.4.3 generic Fantasy failed: $LASTEXITCODE" }
          python tools/normalize_openofc_generic_fantasy_v543.py
          if ($LASTEXITCODE -ne 0) { throw "v5.4.3 normalization failed: $LASTEXITCODE" }
          python tools/apply_openofc_fantasy_source_identity_v543g.py
          if ($LASTEXITCODE -ne 0) { throw "v5.4.3G failed: $LASTEXITCODE" }
          python tools/apply_openofc_fantasy_confirm_guard_v543h.py
          if ($LASTEXITCODE -ne 0) { throw "v5.4.3H failed: $LASTEXITCODE" }
          python tools/apply_openofc_field_recovery_v544.py
          if ($LASTEXITCODE -ne 0) { throw "v5.4.4 failed: $LASTEXITCODE" }
          python tools/apply_openofc_field_recovery_v544b.py
          if ($LASTEXITCODE -ne 0) { throw "v5.4.4B failed: $LASTEXITCODE" }
          python tools/apply_openofc_full_replan_v544c.py
          if ($LASTEXITCODE -ne 0) { throw "v5.4.4C failed: $LASTEXITCODE" }
          python tools/apply_openofc_provisional_supersession_v544d.py
          if ($LASTEXITCODE -ne 0) { throw "v5.4.4D failed: $LASTEXITCODE" }
          python tools/apply_openofc_identity_refinement_v544e.py
          if ($LASTEXITCODE -ne 0) { throw "v5.4.4E failed: $LASTEXITCODE" }
          python tools/normalize_openofc_observability_input_v545pre.py
          if ($LASTEXITCODE -ne 0) { throw "v5.4.5 PRE failed: $LASTEXITCODE" }
          python tools/apply_openofc_observability_deghost_v545.py
          if ($LASTEXITCODE -ne 0) { throw "v5.4.5 observability/deghost failed: $LASTEXITCODE" }
          python tools/normalize_openofc_observability_deghost_v545a.py
          if ($LASTEXITCODE -ne 0) { throw "v5.4.5A normalization failed: $LASTEXITCODE" }
          python tools/apply_openofc_fantasy_field_v546.py
          if ($LASTEXITCODE -ne 0) { throw "v5.4.6 Fantasy field patch failed: $LASTEXITCODE" }
          python tools/test_openofc_fantasy_field_v546.py
          if ($LASTEXITCODE -ne 0) { throw "v5.4.6 Fantasy field regression failed: $LASTEXITCODE" }
          python tools/apply_openofc_fantasy_bounded_click_v547.py
          if ($LASTEXITCODE -ne 0) { throw "v5.4.7 bounded-click patch failed: $LASTEXITCODE" }
          python tools/test_openofc_fantasy_bounded_click_v547.py
          if ($LASTEXITCODE -ne 0) { throw "v5.4.7 bounded-click regression failed: $LASTEXITCODE" }
          Write-Host 'V547_MATERIALIZATION=PASS'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Run v5.4.7 bounded Fantasy executor regression
        shell: pwsh
        run: |
          python tools/test_openofc_fantasy_bounded_click_v547.py
          if ($LASTEXITCODE -ne 0) { throw "v5.4.7 bounded-click regression failed: $LASTEXITCODE" }
          Write-Host 'V547_BOUNDED_FANTASY_EXECUTOR=PASS'

      - name: Run v5.4.6 Fantasy field regression
        shell: pwsh
        run: |
          python tools/test_openofc_fantasy_field_v546.py
          if ($LASTEXITCODE -ne 0) { throw "v5.4.6 Fantasy field regression failed: $LASTEXITCODE" }
          Write-Host 'V546_FANTASY_FIELD_REGRESSION=PASS'

      - name: Run UNKNOWN full-replan regression
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $cmd = '"' + $devcmd + '" -arch=x86 -host_arch=x64 && cl /nologo /EHsc /O2 /MD /std:c++14 /DDEEPOFC_RECONSTRUCTOR_STANDALONE /DDEEPOFC_POLICY_STANDALONE /DDEEPOFC_TURNPLAN_STANDALONE /I OpenHoldem OpenHoldem\COFCReconstructor.cpp OpenHoldem\COFCBaselinePolicy.cpp OpenHoldem\COFCTurnPlan.cpp OpenHoldem\COFCUnknownToleranceSelftest.cpp /Fe:COFCUnknownToleranceSelftest.exe && COFCUnknownToleranceSelftest.exe'
          cmd.exe /d /s /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "UNKNOWN/full-replan regression failed: $LASTEXITCODE" }
          Write-Host 'UNKNOWN_OCCUPIED_FULL_REPLAN_IDENTITY_REFINEMENT=PASS'

      - name: Run Fantasy 14-17 regression
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $cmd = '"' + $devcmd + '" -arch=x86 -host_arch=x64 && cl /nologo /EHsc /O2 /MD /std:c++14 /DDEEPOFC_RECONSTRUCTOR_STANDALONE /DDEEPOFC_POLICY_STANDALONE /I OpenHoldem OpenHoldem\COFCReconstructor.cpp OpenHoldem\COFCBaselinePolicy.cpp OpenHoldem\COFCGenericFantasySelftest.cpp /Fe:COFCGenericFantasySelftest.exe && COFCGenericFantasySelftest.exe'
          cmd.exe /d /s /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "Fantasy regression failed: $LASTEXITCODE" }
          Write-Host 'GENERIC_FANTASY_14_17=PASS'

      - name: Run continuity regressions
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $c1 = '"' + $devcmd + '" -arch=x86 -host_arch=x64 && cl /nologo /EHsc /O2 /MD /std:c++14 /DDEEPOFC_RECONSTRUCTOR_STANDALONE /I OpenHoldem OpenHoldem\COFCReconstructor.cpp OpenHoldem\COFCRuntimeContinuitySelftest.cpp /Fe:COFCRuntimeContinuitySelftest.exe && COFCRuntimeContinuitySelftest.exe'
          cmd.exe /d /s /c $c1
          if ($LASTEXITCODE -ne 0) { throw "runtime continuity regression failed: $LASTEXITCODE" }
          $c2 = '"' + $devcmd + '" -arch=x86 -host_arch=x64 && cl /nologo /EHsc /O2 /MD /std:c++14 /DDEEPOFC_RECONSTRUCTOR_STANDALONE /DDEEPOFC_POLICY_STANDALONE /DDEEPOFC_TURNPLAN_STANDALONE /I OpenHoldem OpenHoldem\COFCReconstructor.cpp OpenHoldem\COFCBaselinePolicy.cpp OpenHoldem\COFCTurnPlan.cpp OpenHoldem\COFCPartialReconnectSelftest.cpp /Fe:COFCPartialReconnectSelftest.exe && COFCPartialReconnectSelftest.exe'
          cmd.exe /d /s /c $c2
          if ($LASTEXITCODE -ne 0) { throw "partial reconnect regression failed: $LASTEXITCODE" }
          $c3 = '"' + $devcmd + '" -arch=x86 -host_arch=x64 && cl /nologo /EHsc /O2 /MD /std:c++14 /DDEEPOFC_RECONSTRUCTOR_STANDALONE /I OpenHoldem OpenHoldem\COFCReconstructor.cpp OpenHoldem\COFCDealerRecoverySelftest.cpp /Fe:COFCDealerRecoverySelftest.exe && COFCDealerRecoverySelftest.exe'
          cmd.exe /d /s /c $c3
          if ($LASTEXITCODE -ne 0) { throw "dealer recovery regression failed: $LASTEXITCODE" }
          Write-Host 'V547_CONTINUITY_REGRESSIONS=PASS'

      - name: Build dependencies
        shell: pwsh
        run: |
          $root = (Resolve-Path '.').Path + '\'
          $common = @('/m','/t:Build','/p:Configuration=Release','/p:Platform=Win32',"/p:SolutionDir=$root",'/v:minimal')
          $projects = @(
            'DLLs/Files_DLL/Files.vcxproj',
            'DLLs/WindowFunctions_DLL/window_functions.vcxproj',
            'DLLs/StringFunctions_DLL/string_functions.vcxproj',
            'DLLs/Debug_DLL/Debug.vcxproj',
            'DLLs/Preferences_DLL/Preferences.vcxproj',
            'DLLs/Globals_DLL/globals.vcxproj',
            'DLLs/GamestateValidation_DLL/GamestateValidation.vcxproj',
            'DLLs/User_DLL/user.vcxproj',
            'PokerTracker_Query_Definitions/pokertracker_query_definitions.vcxproj',
            'Reference Mouse DLL/Reference Mouse DLL.vcxproj',
            'Reference Keyboard DLL/Reference Keyboard DLL.vcxproj'
          )
          foreach ($project in $projects) {
            & msbuild $project @common
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $project" }
          }

      - name: Build OpenHoldem Release Win32
        shell: pwsh
        run: |
          $root = (Resolve-Path '.').Path + '\'
          msbuild OpenHoldem/OpenHoldem.vcxproj /m /t:Build /p:Configuration=Release /p:Platform=Win32 "/p:SolutionDir=$root" /p:BuildProjectReferences=true /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "OpenHoldem build failed: $LASTEXITCODE" }
          if (-not (Test-Path 'Release/OpenHoldem.exe')) { throw 'Release/OpenHoldem.exe missing' }
          Write-Host 'OPENOFC_V547_RELEASE_WIN32=PASS'

      - name: Assemble field-test artifact
        shell: pwsh
        run: |
          $out = 'artifact/OpenOFC_v547_FIELD_TEST'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item 'Release/OpenHoldem.exe' $out
          Get-ChildItem 'Release' -Filter '*.dll' | Copy-Item -Destination $out
          if (Test-Path 'Release/tessdata') { Copy-Item 'Release/tessdata' "$out/tessdata" -Recurse }
          @(
            "source_commit=$env:GITHUB_SHA",
            'source_pr=13',
            'source_branch=openofc-v544-field-recovery',
            'configuration=Release',
            'platform=Win32',
            'patch=OpenOFC_v5.4.7_bounded_fantasy_click_executor',
            'tablemap=USER_CURRENT_V5_4_4_COMPATIBLE'
          ) | Set-Content -Encoding ascii "$out/SOURCE_PROVENANCE.txt"
          $files = @(Get-ChildItem $out -Recurse -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object FullName)
          $lines = foreach ($file in $files) {
            $rel = $file.FullName.Substring((Resolve-Path $out).Path.Length + 1).Replace('\','/')
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$hash  $rel"
          }
          $lines | Set-Content -Encoding ascii "$out/SHA256SUMS.txt"
          Write-Host "OPENOFC_V547_EXE_SHA256=$((Get-FileHash -Algorithm SHA256 "$out/OpenHoldem.exe").Hash.ToLowerInvariant())"

      - name: Upload field-test binary
        uses: actions/upload-artifact@v4
        with:
          name: OpenOFC_v547_FIELD_TEST_BINARY
          path: artifact/OpenOFC_v547_FIELD_TEST
          if-no-files-found: error
