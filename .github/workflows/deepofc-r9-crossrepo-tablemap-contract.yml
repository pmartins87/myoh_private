name: DeepOFC R9 cross-repo tablemap contract

on:
  push:
    branches: [deepofc]
    paths:
      - '.github/workflows/deepofc-r9-crossrepo-tablemap-contract.yml'
      - 'OpenHoldem/COFCScraper.cpp'
      - 'OpenHoldem/CScraper.h'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  verify-python-tablemap-cpp-scraper-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout OpenHoldem deepofc
        uses: actions/checkout@v4
        with:
          ref: deepofc
          path: oh

      - name: Checkout authoritative DeepOFC
        uses: actions/checkout@v4
        with:
          repository: pmartins87/DeepOFC
          ref: main
          path: deepofc
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate real-input replay draft and compare runtime interface
        shell: bash
        run: |
          cd deepofc
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from tools.build_joker_hu_tablemap import build
          from deepofc.tablemap_verify import parse_tablemap, validate_hu_replay_tablemap
          from tests.test_tablemap import _source_tm

          geometry = json.loads(Path('tablemaps/joker_ultimate_hu_450x830_geometry_v1.json').read_text(encoding='utf-8'))
          calibration = json.loads(Path('tablemaps/joker_ultimate_hu_450x830_calibration_v1.json').read_text(encoding='utf-8'))
          fantasy15 = json.loads(Path('tablemaps/joker_ultimate_hu_fantasy15_450x830_geometry_v1.json').read_text(encoding='utf-8'))
          text = build(_source_tm(), geometry, calibration, fantasy15)
          errors = validate_hu_replay_tablemap(text)
          if errors:
              raise SystemExit('DeepOFC real-input generated tablemap failed its verifier: ' + '; '.join(errors))
          audit = parse_tablemap(text)

          if 'ofc_fantasy_active' not in audit.regions:
              raise SystemExit('generated tablemap lacks mandatory Fantasy pre-routing detector')
          if audit.symbols.get('ofc_fantasy15_geometry_measured') != '1':
              raise SystemExit('generated tablemap did not record measured Fantasy15 geometry')
          if audit.symbols.get('ofc_fantasy_recognizer_calibrated') != '0':
              raise SystemExit('Fantasy15 geometry unexpectedly authorizes the uncertified 14..17-card recognizer')
          if audit.symbols.get('ofc_drag_targets_calibrated') != '0' or audit.symbols.get('ofc_executor_enabled') != '0':
              raise SystemExit('measured Fantasy15 geometry unexpectedly enabled physical action authority')

          fantasy = calibration.get('fantasy_active') or {}
          if fantasy.get('point') != [225, 760] or str(fantasy.get('rgb', '')).lower() != '874c00':
              raise SystemExit(f'unexpected replay Fantasy detector calibration: {fantasy!r}')

          expected_geometry_regions = {
              *(f'ofc_fantasy15_src{i:02d}' for i in range(15)),
              *(f'ofc_fantasy15_arrange_top{i}' for i in range(3)),
              *(f'ofc_fantasy15_arrange_middle{i}' for i in range(5)),
              *(f'ofc_fantasy15_arrange_bottom{i}' for i in range(5)),
              'ofc_fantasy15_unused_span',
          }
          missing_geometry = sorted(expected_geometry_regions - set(audit.regions))
          if missing_geometry:
              raise SystemExit('measured Fantasy15 geometry missing from generated draft: ' + ', '.join(missing_geometry))

          region_lines = {
              line.split()[0][2:]: line
              for line in text.splitlines()
              if line.startswith('r$ofc_fantasy15_')
          }
          for name in expected_geometry_regions:
              line = region_lines.get(name)
              if line is None:
                  raise SystemExit(f'cannot inspect generated geometry region {name}')
              # Generated syntax places transform after name, rect, color, radius.
              tokens = line.split()
              if len(tokens) < 8 or tokens[7] != 'N':
                  raise SystemExit(f'{name} is no longer geometry-only N-transform: {line}')

          first_tokens = region_lines['ofc_fantasy15_src00'].split()
          last_tokens = region_lines['ofc_fantasy15_src14'].split()
          first_rect = [int(x) for x in first_tokens[1:5]]
          last_rect = [int(x) for x in last_tokens[1:5]]
          if first_rect != fantasy15['fan_slots_left_to_right'][0]['identity_patch']:
              raise SystemExit('Fantasy15 src00 rectangle drifted from measured evidence')
          if last_rect != fantasy15['fan_slots_left_to_right'][14]['identity_patch']:
              raise SystemExit('Fantasy15 src14 rectangle drifted from measured evidence')

          sample_bases = (
              'ofc_p0_top0',
              'ofc_p1_bottom4',
              'ofc_p0_discard0',
              'ofc_hero_discard3',
              'ofc_hero_in2',
          )
          for base in sample_bases:
              for suffix in ('joker1', 'joker2'):
                  if base + suffix not in audit.regions:
                      raise SystemExit(f'missing generated persistent Joker region: {base + suffix}')
              if base + 'joker' in audit.regions:
                  raise SystemExit(f'legacy single-Joker region survived: {base + "joker"}')

          cpp = Path('../oh/OpenHoldem/COFCScraper.cpp').read_text(encoding='utf-8', errors='replace')
          header = Path('../oh/OpenHoldem/CScraper.h').read_text(encoding='utf-8', errors='replace')
          required_cpp = (
              'base_name + "joker1"',
              'base_name + "joker2"',
              'int *joker_id',
              'kOFCCardJoker1',
              'kOFCCardJoker2',
              '"ofc_fantasy_active"',
              'Fantasy arrangement detected; normal geometry is forbidden',
          )
          missing = [token for token in required_cpp if token not in cpp and token not in header]
          if missing:
              raise SystemExit('C++ OFC contract missing: ' + ', '.join(missing))
          if 'bool *is_joker' in cpp or 'bool *is_joker' in header:
              raise SystemExit('legacy frame-local is_joker scraper contract returned')

          detector = cpp.index('"ofc_fantasy_active"')
          normal_rows = cpp.index('for (int p = 0; p < player_count; ++p)')
          normal_incoming = cpp.index('ofc_hero_in%d')
          if detector > normal_rows or detector > normal_incoming:
              raise SystemExit('Fantasy routing detector occurs after normal geometry')

          print('PASS: DeepOFC/OH agree on Fantasy routing, measured Fantasy15 geometry, recognizer-off authority and joker1/joker2')
          PY

      - name: Assert replay draft remains non-actionable
        shell: bash
        run: |
          grep -q '"ofc_fantasy_recognizer_calibrated": "0"' deepofc/tools/build_joker_hu_tablemap.py
          grep -q '"ofc_drag_targets_calibrated": "0"' deepofc/tools/build_joker_hu_tablemap.py
          grep -q '"ofc_executor_enabled": "0"' deepofc/tools/build_joker_hu_tablemap.py
          grep -q 'DeepOFC R9 hard read-only guard' oh/OpenHoldem/CAutoplayer.cpp
          if grep -q '_dll_mouse_' oh/OpenHoldem/COFCScraper.cpp; then
            echo 'ERROR: scraper contains mouse execution path'
            exit 1
          fi
          echo 'PASS: cross-repo contract remains read-only and Fantasy recognition authority stays off'
