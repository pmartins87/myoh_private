name: OpenOFC v5.4.3H Fantasy Confirm gate

on:
  push:
    branches:
      - 'openofc-v543-confirm-gate'
  pull_request:
    branches:
      - 'openofc-v543-generic-fantasy'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-fantasy-confirm:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply frozen v5.3 patch chain
        shell: pwsh
        run: |
          python -c "import tools.apply_openofc_runtime_repair as r; r.patch_transform(); r.patch_opponent_discards(); r.patch_capture(); print('OpenOFC runtime source repair applied successfully')"
          python tools/apply_openofc_log248_repair.py
          python tools/run_openofc_gameflow_v2.py
          python tools/apply_openofc_normal_flow_v3.py
          python tools/apply_openofc_phase_flow_v4.py
          python tools/apply_openofc_phase_flow_v41.py
          python tools/apply_openofc_round_discard_exit_v42.py
          python tools/apply_openofc_normal_completion_v43.py
          python tools/apply_openofc_simultaneous_dealer_v44.py
          python tools/run_openofc_fantasy_v5.py
          python tools/apply_openofc_opponent_history_v52.py
          python tools/run_openofc_smart_policy_v53.py
          if ($LASTEXITCODE -ne 0) { throw "frozen v5.3 chain failed: $LASTEXITCODE" }

      - name: Apply v5.4 through v5.4.3G chain
        shell: pwsh
        run: |
          python tools/run_openofc_runtime_continuity_v54.py
          if ($LASTEXITCODE -ne 0) { throw "v5.4 continuity failed: $LASTEXITCODE" }
          python tools/apply_openofc_partial_reconnect_v542b.py
          if ($LASTEXITCODE -ne 0) { throw "v5.4.2B failed: $LASTEXITCODE" }
          python tools/apply_openofc_dealer_recovery_v542c.py
          if ($LASTEXITCODE -ne 0) { throw "v5.4.2C failed: $LASTEXITCODE" }
          python tools/normalize_openofc_dealer_recovery_v542c.py
          if ($LASTEXITCODE -ne 0) { throw "v5.4.2C normalization failed: $LASTEXITCODE" }
          python tools/run_openofc_generic_fantasy_v543.py
          if ($LASTEXITCODE -ne 0) { throw "v5.4.3 failed: $LASTEXITCODE" }
          python tools/normalize_openofc_generic_fantasy_v543.py
          if ($LASTEXITCODE -ne 0) { throw "v5.4.3 normalization failed: $LASTEXITCODE" }
          python tools/apply_openofc_fantasy_source_identity_v543g.py
          if ($LASTEXITCODE -ne 0) { throw "v5.4.3G failed: $LASTEXITCODE" }

      - name: Apply v5.4.3H Fantasy Confirm hardening
        shell: pwsh
        run: |
          python tools/apply_openofc_fantasy_confirm_guard_v543h.py
          if ($LASTEXITCODE -ne 0) { throw "v5.4.3H Confirm hardening failed: $LASTEXITCODE" }
          Write-Host 'FANTASY_CONFIRM_SOURCE_HARDENING=PASS'

      - name: Inspect materialized Fantasy Confirm runtime
        shell: pwsh
        run: |
          python tools/inspect_openofc_fantasy_confirm_runtime_v543.py
          if ($LASTEXITCODE -ne 0) { throw "Fantasy Confirm runtime inspection failed: $LASTEXITCODE" }
          $runtime = Get-Content -Raw 'OpenHoldem/COFCRuntimeController.cpp'
          foreach ($needle in @(
            'COFCFantasyConfirmGuard::Validate',
            'fantasy_confirm_fence_.CanDispatch',
            'fantasy_confirm_fence_.MarkDispatched',
            'ObserveUnchangedAfterDispatch',
            'physical_dispatch=1',
            'duplicate_input_suppressed=1',
            'ack=TIMEOUT',
            'physical retry forbidden')) {
            if (-not $runtime.Contains($needle)) { throw "v5.4.3H runtime marker missing: $needle" }
          }
          $click = $runtime.IndexOf('p_casino_interface->ClickRectSafely(rect)')
          $mark = $runtime.IndexOf('fantasy_confirm_fence_.MarkDispatched(confirm_fingerprint)')
          if ($click -lt 0 -or $mark -le $click) {
            throw 'Confirm fence is not armed strictly after successful ClickRectSafely dispatch'
          }
          Write-Host 'FANTASY_CONFIRM_RUNTIME_SOURCE_CONTRACT=PASS'
          Write-Host 'FANTASY_CONFIRM_FENCE_ORDERING=PASS'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Compile and run pure Fantasy Confirm guard/fence regression
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $command = '"' + $devcmd + '" -arch=x86 -host_arch=x64 && cl /nologo /EHsc /O2 /MD /std:c++14 /DNOMINMAX /I OpenHoldem OpenHoldem\COFCFantasyConfirmGuardSelftest.cpp /Fe:COFCFantasyConfirmGuardSelftest.exe && COFCFantasyConfirmGuardSelftest.exe'
          cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw "Fantasy Confirm guard/fence regression failed: $LASTEXITCODE" }
          Write-Host 'FANTASY_CONFIRM_SEMANTIC_GUARD=PASS'
          Write-Host 'FANTASY_CONFIRM_FENCE_STATE_MACHINE=PASS'

      - name: Generate and run actual-controller Confirm regression
        shell: pwsh
        run: |
          python tools/materialize_openofc_fantasy_confirm_controller_selftest_v543h.py
          if ($LASTEXITCODE -ne 0) { throw "Fantasy Confirm controller seam generation failed: $LASTEXITCODE" }
          $generated = Get-Content -Raw 'OpenHoldem/COFCFantasyConfirmControllerGeneratedSelftest.cpp'
          if ($generated.Contains('p_casino_interface') -or $generated.Contains('ReadRegion(')) {
            throw 'real mouse/TableMap dependency survived generated controller test seam'
          }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $command = '"' + $devcmd + '" -arch=x86 -host_arch=x64 && cl /nologo /EHsc /O2 /MD /std:c++14 /DNOMINMAX /I OpenHoldem OpenHoldem\COFCFantasyConfirmControllerGeneratedSelftest.cpp /Fe:COFCFantasyConfirmControllerGeneratedSelftest.exe && COFCFantasyConfirmControllerGeneratedSelftest.exe'
          cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw "dynamic Fantasy Confirm controller regression failed: $LASTEXITCODE" }
          Write-Host 'FANTASY_CONFIRM_DYNAMIC_CONTROLLER_GATE=PASS'

      - name: Re-run Fantasy Joker executor regression under H source tree
        shell: pwsh
        run: |
          $executor = 'OpenHoldem/COFCFantasyBatchExecutor.cpp'
          $executorBackup = Join-Path $env:RUNNER_TEMP 'COFCFantasyBatchExecutor.production.cpp'
          Copy-Item $executor $executorBackup -Force
          try {
            python tools/apply_openofc_fantasy_executor_test_seam_v543.py
            if ($LASTEXITCODE -ne 0) { throw "Fantasy executor seam failed: $LASTEXITCODE" }
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
            $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
            $command = '"' + $devcmd + '" -arch=x86 -host_arch=x64 && cl /nologo /EHsc /O2 /MD /std:c++14 /DNOMINMAX /I OpenHoldem OpenHoldem\COFCFantasyBatchExecutor.cpp OpenHoldem\COFCFantasyJokerExecutionSelftest.cpp /Fe:COFCFantasyJokerExecutionSelftest.exe /link user32.lib && COFCFantasyJokerExecutionSelftest.exe'
            cmd.exe /d /s /c $command
            if ($LASTEXITCODE -ne 0) { throw "Fantasy Joker executor regression failed under H: $LASTEXITCODE" }
          }
          finally {
            Copy-Item $executorBackup $executor -Force
          }
          $restored = Get-Content -Raw $executor
          if (-not $restored.Contains('#include "StdAfx.h"')) {
            throw 'production Fantasy executor PCH include was not restored after test seam'
          }
          if ($restored.Contains('DeepOFCTestFantasy')) {
            throw 'Fantasy executor test seam survived production-source restoration'
          }
          Write-Host 'FANTASY_EXECUTOR_PRODUCTION_SOURCE_RESTORED=PASS'

      - name: Build dependency chain
        shell: pwsh
        run: |
          $root = (Resolve-Path '.').Path + '\'
          $common = @('/m','/t:Build','/p:Configuration=Release','/p:Platform=Win32',"/p:SolutionDir=$root",'/v:minimal')
          $projects = @(
            'DLLs/Files_DLL/Files.vcxproj',
            'DLLs/WindowFunctions_DLL/window_functions.vcxproj',
            'DLLs/StringFunctions_DLL/string_functions.vcxproj',
            'DLLs/Debug_DLL/Debug.vcxproj',
            'DLLs/Preferences_DLL/Preferences.vcxproj',
            'DLLs/Globals_DLL/globals.vcxproj',
            'DLLs/GamestateValidation_DLL/GamestateValidation.vcxproj',
            'DLLs/User_DLL/user.vcxproj',
            'PokerTracker_Query_Definitions/pokertracker_query_definitions.vcxproj',
            'Reference Mouse DLL/Reference Mouse DLL.vcxproj',
            'Reference Keyboard DLL/Reference Keyboard DLL.vcxproj'
          )
          foreach ($project in $projects) {
            & msbuild $project @common
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $project" }
          }

      - name: Build OpenHoldem Release Win32
        shell: pwsh
        run: |
          $root = (Resolve-Path '.').Path + '\'
          msbuild OpenHoldem/OpenHoldem.vcxproj /m /t:Build /p:Configuration=Release /p:Platform=Win32 "/p:SolutionDir=$root" /p:BuildProjectReferences=true /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "OpenHoldem Win32 build failed: $LASTEXITCODE" }
          Write-Host 'V543H_RELEASE_WIN32=PASS'

      - name: Freeze v5.4.3H gate result
        shell: pwsh
        run: |
          Write-Host 'FANTASY_CONFIRM_SEMANTIC_GUARD=PASS'
          Write-Host 'FANTASY_CONFIRM_FENCE_STATE_MACHINE=PASS'
          Write-Host 'FANTASY_CONFIRM_RUNTIME_SOURCE_CONTRACT=PASS'
          Write-Host 'FANTASY_CONFIRM_DYNAMIC_CONTROLLER_GATE=PASS'
          Write-Host 'FANTASY_CONFIRM_GATE=PASS'
          Write-Host 'FIELD_PACKAGE_AUTHORIZED=0'
