name: OpenOFC M5B continuation-aware Fantasy self-play gate

on:
  push:
    branches:
      - 'openofc-m4v-continuation-transport'
    paths:
      - 'tools/openofc_solver/m5b_fantasy_selfplay.py'
      - 'tools/openofc_solver/test_m5b_fantasy_selfplay.py'
      - 'tools/openofc_solver/M5B_FANTASY_SELFPLAY_CONTRACT.md'
      - '.github/workflows/openofc-m5b-fantasy-selfplay.yml'
  pull_request:
    paths:
      - 'tools/openofc_solver/m5b_fantasy_selfplay.py'
      - 'tools/openofc_solver/test_m5b_fantasy_selfplay.py'
      - 'tools/openofc_solver/M5B_FANTASY_SELFPLAY_CONTRACT.md'
      - '.github/workflows/openofc-m5b-fantasy-selfplay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m5b-fantasy-selfplay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Materialize certified Joker semantics
        run: python tools/openofc_solver/apply_m1b_joker_semantics.py

      - name: Validate continuation-aware fitted self-play
        run: |
          cd tools/openofc_solver
          python test_m5b_fantasy_selfplay.py
