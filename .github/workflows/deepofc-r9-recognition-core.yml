name: DeepOFC R9 recognition core

on:
  push:
    branches: [deepofc]
    paths:
      - '.github/workflows/deepofc-r9-recognition-core.yml'
      - 'OpenHoldem/COFCFantasyRecognitionCore.h'
      - 'OpenHoldem/COFCFantasyRecognitionCoreSelftest.cpp'
      - 'OpenHoldem/COFCFantasyRecognizerBankSelftest.cpp'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-and-test:
    runs-on: windows-2022
    steps:
      - name: Checkout OpenHoldem deepofc
        uses: actions/checkout@v4
        with:
          ref: deepofc
          fetch-depth: 0

      - name: Checkout authoritative DeepOFC
        uses: actions/checkout@v4
        with:
          repository: pmartins87/DeepOFC
          ref: main
          path: _deepofc_reference
          persist-credentials: false

      - name: Export frozen DeepOFC JSON banks into generated C++ header
        shell: pwsh
        run: |
          python _deepofc_reference/tools/export_fantasy_recognizer_cpp.py `
            --fan-bank _deepofc_reference/tablemaps/joker_ultimate_hu_fantasy15_rank_medoid_bank_v1.json `
            --upright-bank _deepofc_reference/tablemaps/joker_ultimate_hu_upright_rank_bank_v1.json `
            --out OpenHoldem/COFCFantasyRecognizerBanks.generated.h
          if ($LASTEXITCODE -ne 0) { throw "Recognizer bank export failed: $LASTEXITCODE" }
          Select-String -Path OpenHoldem/COFCFantasyRecognizerBanks.generated.h -Pattern 'kDeepOFCRecognizerBanksRuntimeAuthorized = false'

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Compile and run portable recognition-core selftest
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          if (-not $vs) { throw 'Visual Studio installation not found' }
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $command = '"' + $devcmd + '" -arch=x86 -host_arch=x64 && cl /nologo /EHsc /std:c++14 OpenHoldem\COFCFantasyRecognitionCoreSelftest.cpp /Fe:COFCFantasyRecognitionCoreSelftest.exe && COFCFantasyRecognitionCoreSelftest.exe'
          cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw "Recognition core selftest failed: $LASTEXITCODE" }

      - name: Compile and run generated-bank selftest
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $command = '"' + $devcmd + '" -arch=x86 -host_arch=x64 && cl /nologo /EHsc /std:c++14 OpenHoldem\COFCFantasyRecognizerBankSelftest.cpp /Fe:COFCFantasyRecognizerBankSelftest.exe && COFCFantasyRecognizerBankSelftest.exe'
          cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw "Generated bank selftest failed: $LASTEXITCODE" }

      - name: Persist generated data header only after C++ gates pass
        shell: pwsh
        run: |
          $path = 'OpenHoldem/COFCFantasyRecognizerBanks.generated.h'
          $changed = git status --porcelain -- $path
          if (-not $changed) { Write-Host 'Generated recognizer bank already current.'; exit 0 }
          git config user.name 'DeepOFC Recognition Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add -- $path
          git commit -m 'DeepOFC R9: persist generated native recognizer banks'
          git push origin HEAD:deepofc
