name: OpenOFC M4N exact Fantasy counterfactual frontier gate

on:
  pull_request:
    paths:
      - 'tools/openofc_solver/fantasy_counterfactual_frontier.py'
      - 'tools/openofc_solver/test_fantasy_counterfactual_frontier.py'
      - 'tools/openofc_solver/M4N_COUNTERFACTUAL_FRONTIER_CONTRACT.md'
      - '.github/workflows/openofc-m4n-counterfactual-frontier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m4n-counterfactual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Materialize certified Joker semantics
        run: python tools/openofc_solver/apply_m1b_joker_semantics.py

      - name: Validate exact poker teacher and sealed-policy firewall
        run: |
          python tools/openofc_solver/test_fantasy_counterfactual_frontier.py
          echo OPENOFC_M4N_GATE=PASS
