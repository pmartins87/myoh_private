name: DeepOFC R10 transactional executor build gate

on:
  push:
    branches: [deepofc]
    paths:
      - '.github/workflows/deepofc-r10-executor-build.yml'
      - '.github/scripts/deepofc_r10_casino_drag_integrate.ps1'
      - 'CTablemap/CTablemap.cpp'
      - 'CTablemap/CTablemap.h'
      - 'OpenHoldem/COFCState.h'
      - 'OpenHoldem/COFCReconstructor.cpp'
      - 'OpenHoldem/COFCReconstructor.h'
      - 'OpenHoldem/COFCScraper.cpp'
      - 'OpenHoldem/CScraper.h'
      - 'OpenHoldem/COFCFantasy15PixelRecognizer.cpp'
      - 'OpenHoldem/COFCFantasy15PixelRecognizer.h'
      - 'OpenHoldem/COFCFantasy15PixelModel.generated.h'
      - 'OpenHoldem/COFCActionPlanner.cpp'
      - 'OpenHoldem/COFCActionPlanner.h'
      - 'OpenHoldem/COFCActionExecutor.cpp'
      - 'OpenHoldem/COFCActionExecutor.h'
      - 'OpenHoldem/CCasinoInterface.cpp'
      - 'OpenHoldem/CCasinoInterface.h'
      - 'OpenHoldem/CAutoplayer.cpp'
      - 'OpenHoldem/OpenHoldem.vcxproj'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-transaction-layer-with-live-path-disconnected:
    runs-on: windows-2022
    steps:
      - name: Checkout deepofc
        uses: actions/checkout@v4
        with:
          ref: deepofc
          fetch-depth: 0

      - name: Apply guarded casino drag wrapper
        shell: pwsh
        run: .github/scripts/deepofc_r10_casino_drag_integrate.ps1

      - name: Add executor compilation unit to OpenHoldem project
        shell: pwsh
        run: |
          $path = 'OpenHoldem/OpenHoldem.vcxproj'
          $text = Get-Content -Raw -Encoding UTF8 $path
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $eol = if ($text.Contains("`r`n")) { "`r`n" } else { "`n" }
          if ($text -notmatch 'ClCompile Include="COFCActionExecutor\.cpp"') {
            $needle = '    <ClCompile Include="COFCActionPlanner.cpp" />'
            if (-not $text.Contains($needle)) { throw 'Could not find COFCActionPlanner.cpp project entry' }
            $text = $text.Replace($needle, $needle + $eol + '    <ClCompile Include="COFCActionExecutor.cpp" />')
          }
          [System.IO.File]::WriteAllText((Resolve-Path $path), $text, $utf8)
          Select-String -Path $path -Pattern 'COFC(Fantasy15PixelRecognizer|ActionPlanner|ActionExecutor|Reconstructor|Scraper)\.cpp'

      - name: Assert R9-R10 vertical-slice contract before build
        shell: pwsh
        run: |
          $scraper = Get-Content -Raw -Encoding UTF8 'OpenHoldem/COFCScraper.cpp'
          $reconstructor = Get-Content -Raw -Encoding UTF8 'OpenHoldem/COFCReconstructor.cpp'
          $fantasyPixel = Get-Content -Raw -Encoding UTF8 'OpenHoldem/COFCFantasy15PixelRecognizer.cpp'
          $fantasyModel = Get-Content -Raw -Encoding UTF8 'OpenHoldem/COFCFantasy15PixelModel.generated.h'
          $planner = Get-Content -Raw -Encoding UTF8 'OpenHoldem/COFCActionPlanner.cpp'
          $executor = Get-Content -Raw -Encoding UTF8 'OpenHoldem/COFCActionExecutor.cpp'
          $project = Get-Content -Raw -Encoding UTF8 'OpenHoldem/OpenHoldem.vcxproj'
          $tablemap = (Get-Content -Raw -Encoding UTF8 'CTablemap/CTablemap.cpp') + (Get-Content -Raw -Encoding UTF8 'CTablemap/CTablemap.h')

          if ($scraper -notmatch 'ScrapeOFCFantasyVisualObservation') { throw 'isolated Fantasy scrape route missing' }
          if ($scraper -notmatch 'DEEPOFC_NATIVE_FANTASY15_RECOGNIZER_CERTIFIED\s+0') { throw 'uncertified Fantasy recognizer is not hard-disabled' }
          if ($scraper -match 'COFCFantasy15PixelRecognizer|RecognizeInitialFan') { throw 'pixel recognizer wired into scraper before native replay certification' }
          if ($reconstructor -notmatch 'JK1/JK2 are persistent visual identities') { throw 'persistent physical Joker identity contract missing' }

          if ($fantasyPixel -notmatch 'RecognizeInitialFan') { throw 'Fantasy15 real-pixel recognizer entrypoint missing' }
          if ($fantasyPixel -notmatch 'VerifyFrozenModel') { throw 'Fantasy15 frozen-model integrity check missing' }
          if ($fantasyPixel -notmatch 'kExpectedWidth\s*=\s*450' -or $fantasyPixel -notmatch 'kExpectedHeight\s*=\s*830') {
            throw 'Fantasy15 certified geometry dimensions drifted'
          }
          foreach ($primitive in @('SendInput','mouse_event','SetCursorPos','PostMessage','DragRectToRect','ClickRect')) {
            if ($fantasyPixel -match [regex]::Escape($primitive)) { throw "action primitive leaked into recognition-only component: $primitive" }
          }
          if ($fantasyModel -notmatch 'kFeatureCount=324' -or $fantasyModel -notmatch 'kRankCount=13') {
            throw 'Fantasy15 frozen model dimensions missing/drifted'
          }
          if ($fantasyModel -notmatch 'kStandardMaxDistance=2.25f' -or $fantasyModel -notmatch 'kStandardMinMargin=0.15f' -or $fantasyModel -notmatch 'kJokerMinDistance=3.20f') {
            throw 'Fantasy15 frozen model thresholds drifted'
          }
          if ($project -notmatch 'ClCompile Include="COFCFantasy15PixelRecognizer\.cpp"') {
            throw 'Fantasy15 pixel recognizer is not compiled into OpenHoldem'
          }

          if ($planner -notmatch 'BuildPlacementStepFromObservation') { throw 'planner is not bound to fresh raw source geometry' }
          if ($planner -notmatch 'ofc_drag_targets_calibrated') { throw 'explicit drag-target calibration gate missing' }
          if ($executor -notmatch 'ofc_executor_enabled') { throw 'explicit executor runtime gate missing' }
          if ($executor -notmatch 'VerifyPendingTransition') { throw 'post-drag canonical verification missing' }
          foreach ($symbol in @('ofc_fantasy_recognizer_calibrated','ofc_drag_targets_calibrated','ofc_executor_enabled')) {
            if ($tablemap -notmatch [regex]::Escape($symbol)) { throw "central tablemap authority symbol missing: $symbol" }
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build native dependency chain
        shell: pwsh
        run: |
          $root = (Resolve-Path '.').Path + '\'
          $common = @('/m','/t:Build','/p:Configuration=Release','/p:Platform=Win32',"/p:SolutionDir=$root",'/v:minimal')
          $projects = @(
            'DLLs/Files_DLL/Files.vcxproj',
            'DLLs/WindowFunctions_DLL/window_functions.vcxproj',
            'DLLs/StringFunctions_DLL/string_functions.vcxproj',
            'DLLs/Debug_DLL/Debug.vcxproj',
            'DLLs/Preferences_DLL/Preferences.vcxproj',
            'DLLs/Globals_DLL/globals.vcxproj',
            'DLLs/GamestateValidation_DLL/GamestateValidation.vcxproj',
            'DLLs/User_DLL/user.vcxproj',
            'PokerTracker_Query_Definitions/pokertracker_query_definitions.vcxproj'
          )
          foreach ($project in $projects) {
            & msbuild $project @common
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $project" }
          }

      - name: Assert OpenHoldem link inputs
        shell: pwsh
        run: |
          $required = @('Preferences.lib','globals.lib','pokertracker_query_definitions.lib','Reference User DLL.lib','window_functions.lib','string_functions.lib','debug.lib','GameStateValidation.lib','files.lib')
          foreach ($name in $required) {
            if (-not (Test-Path (Join-Path 'Release' $name))) { throw "Missing link input: $name" }
          }

      - name: Build OpenHoldem Release Win32
        shell: pwsh
        run: |
          $root = (Resolve-Path '.').Path + '\'
          msbuild OpenHoldem/OpenHoldem.vcxproj /m /t:Build /p:Configuration=Release /p:Platform=Win32 "/p:SolutionDir=$root" /p:BuildProjectReferences=true /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "OpenHoldem build failed: $LASTEXITCODE" }
          if (-not (Test-Path 'Release/OpenHoldem.exe')) { throw 'OpenHoldem.exe missing' }

      - name: Assert transactional safety and live disconnection
        shell: pwsh
        run: |
          $executor = 'OpenHoldem/COFCActionExecutor.cpp'
          if (-not (Select-String -Path $executor -Pattern 'ofc_executor_enabled' -Quiet)) {
            throw 'Executor explicit runtime-enable gate missing'
          }
          if (-not (Select-String -Path $executor -Pattern 'awaiting_verification_' -Quiet)) {
            throw 'Executor mandatory verification phase missing'
          }
          if (-not (Select-String -Path $executor -Pattern 'VerifyPendingTransition' -Quiet)) {
            throw 'Executor post-drag canonical verification missing'
          }
          if (-not (Select-String -Path $executor -Pattern 'DragRectToRect' -Quiet)) {
            throw 'Executor is not connected to guarded casino drag wrapper'
          }
          if (-not (Select-String -Path 'OpenHoldem/CCasinoInterface.cpp' -Pattern 'TableLostFocus\(\)' -Quiet)) {
            throw 'Casino drag focus safety check missing'
          }
          if (Select-String -Path 'OpenHoldem/CAutoplayer.cpp' -Pattern 'COFCActionExecutor|BeginPlacement|COFCFantasy15PixelRecognizer|RecognizeInitialFan' -Quiet) {
            throw 'OFC execution/recognition was wired into live CAutoplayer before R9/R10 gates'
          }
          if (-not (Select-String -Path 'OpenHoldem/CAutoplayer.cpp' -Pattern 'DeepOFC R9 hard read-only guard' -Quiet)) {
            throw 'R9 hard read-only guard missing'
          }
          Write-Host 'R9 recognition/reconstruction and R10 transaction layer compile together; live execution remains disconnected.'

      - name: Persist validated wrapper/project entry only after PASS
        shell: pwsh
        run: |
          $paths = @('OpenHoldem/CCasinoInterface.cpp','OpenHoldem/OpenHoldem.vcxproj')
          $changed = git diff --name-only -- $paths
          if (-not $changed) { Write-Host 'Executor integration already persisted.'; exit 0 }
          git config user.name 'DeepOFC Build Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add -- $paths
          git commit -m 'DeepOFC R10: persist transactional drag executor infrastructure'
          git pull --rebase origin deepofc
          if ($LASTEXITCODE -ne 0) { throw 'Could not rebase validated executor integration onto current deepofc' }
          git push origin HEAD:deepofc
          if ($LASTEXITCODE -ne 0) { throw 'Could not persist validated executor integration' }
