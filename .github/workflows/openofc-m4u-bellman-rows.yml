name: OpenOFC M4U kernel Bellman-row gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m4u-bellman-rows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Materialize certified Joker semantics
        run: python tools/openofc_solver/apply_m1b_joker_semantics.py

      - name: Validate Bellman-row coverage and fail-closed assembly
        run: |
          python tools/openofc_solver/test_hu_bellman_rows.py
          echo OPENOFC_M4U_GATE=PASS
