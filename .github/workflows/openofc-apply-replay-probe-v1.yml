name: OpenOFC apply replay probe v1

on:
  push:
    branches:
      - agent/openofc-foundation
    paths:
      - 'tools/apply_openofc_replay_probe_v1.py'
      - '.github/workflows/openofc-apply-replay-probe-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenOFC branch
        uses: actions/checkout@v4
        with:
          ref: agent/openofc-foundation
          fetch-depth: 0

      - name: Apply replay-visible mouse probe
        run: python tools/apply_openofc_replay_probe_v1.py

      - name: Commit materialized source
        shell: bash
        run: |
          git config user.name "OpenOFC automation"
          git config user.email "actions@users.noreply.github.com"
          git add OpenHoldem/CCasinoInterface.h OpenHoldem/CCasinoInterface.cpp "Reference Mouse DLL/mousedll.cpp" OpenHoldem/COFCRuntimeController.h OpenHoldem/COFCRuntimeController.cpp
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "OpenOFC: make OHReplay mouse probe visible and non-blocking"
          git push origin HEAD:agent/openofc-foundation
