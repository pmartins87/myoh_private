name: DeepOFC FP0 playable build

on:
  push:
    branches:
      - deepofc
      - 'agent/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build-replay-package:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert operational code contract
        shell: pwsh
        run: |
          $scraper = Get-Content -Raw 'OpenHoldem/COFCScraper.cpp'
          if ($scraper -notmatch 'DEEPOFC_NATIVE_FANTASY15_RECOGNIZER_CERTIFIED\s+1') {
            throw 'Native Fantasy15 recognizer is not enabled in this build'
          }

          # Standard OFC card recognition is TableMap text-transform based.
          # Pixel/native recognition is allowed only in the isolated Fantasy path.
          $slotStart = $scraper.IndexOf('int CScraper::ScrapeOFCSlot')
          $slotEnd = $scraper.IndexOf('static bool DeepOFCRegisterKnownCard', $slotStart)
          if (($slotStart -lt 0) -or ($slotEnd -le $slotStart)) {
            throw 'Could not isolate CScraper::ScrapeOFCSlot for contract validation'
          }
          $standardSlot = $scraper.Substring($slotStart, $slotEnd - $slotStart)
          if ($standardSlot -match 'p_auto_ocr|GetDetectTemplateResult|GetDetectTemplatesResult|get_ocr_result') {
            throw 'AutoOCR/template recognition is forbidden in the standard OpenOFC card path'
          }
          if ($standardSlot -match 'DetectPersistentJoker|RecognizeUprightCard|NATIVE_FALLBACK|TABLEMAP_OCR') {
            throw 'Native pixel fallback is forbidden in the standard OpenOFC card path'
          }
          if (($standardSlot -notmatch 'ScrapeCardByRankAndSuit\(base_name\)') -or
              ($standardSlot -notmatch 'TABLEMAP_TEXT') -or
              ($standardSlot -notmatch 'shared=ScrapeCardByRankAndSuit')) {
            throw 'OpenOFC standard cards are not routed through the shared TableMap text primitive'
          }
          if (($standardSlot -notmatch 'EvaluateRegion\(suit_region') -or
              ($standardSlot -notmatch 'EvaluateRegion\(rank_region')) {
            throw 'OpenOFC failure diagnostics lost direct rank/suit transform evidence'
          }

          $autoplayer = Get-Content -Raw 'OpenHoldem/CAutoplayer.cpp'
          if ($autoplayer -match 'R9 hard read-only guard') {
            throw 'Obsolete OFC no-action guard is still present'
          }
          if ($autoplayer -notmatch 'deepofc_runtime_controller\.Tick') {
            throw 'OFC runtime controller is not connected'
          }
          $lazy = Get-Content -Raw 'OpenHoldem/CLazyScraper.cpp'
          if (($lazy -notmatch 'last canonical lineage preserved') -or
              ($lazy -notmatch 'OFCVisualObservation\(\)->valid = false')) {
            throw 'Transient-frame lineage preservation is not active'
          }

          # OpenOFC architectural boundary. OFC is not allowed to fall through
          # the Hold'em symbol/validator/UI pipeline anymore.
          $heartbeat = Get-Content -Raw 'OpenHoldem/CHeartbeatThread.cpp'
          if ($heartbeat -notmatch 'SupportsOFCJokerUltimate') {
            throw 'OpenOFC heartbeat mode gate is missing'
          }
          if ($heartbeat -notmatch 'holdem_engines_bypassed=1') {
            throw 'OpenOFC startup evidence is missing'
          }
          if ($heartbeat -notmatch '(?s)if \(openofc_mode\).*?else \{.*?EvaluateAll\(\)') {
            throw 'Holdem EvaluateAll is not explicitly isolated behind the non-OpenOFC branch'
          }
          if ($heartbeat -notmatch '(?s)if \(!openofc_mode\).*?Validate\(\)') {
            throw 'Holdem validator is not explicitly gated away from OpenOFC'
          }
          $title = Get-Content -Raw 'OpenHoldem/COpenHoldemTitle.cpp'
          if ($title -notmatch 'OpenOFC \| KKPoker Joker Ultimate') {
            throw 'OpenOFC window identity is missing'
          }
          $status = Get-Content -Raw 'OpenHoldem/COpenHoldemStatusbar.cpp'
          if (($status -notmatch 'OFC READ: OK') -or ($status -notmatch 'Hero: ARRANGE')) {
            throw 'OpenOFC status display is missing'
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Compile and run deterministic policy selftest
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $command = '"' + $devcmd + '" -arch=x86 -host_arch=x64 && cl /nologo /EHsc /O2 /MD /std:c++14 /DDEEPOFC_POLICY_STANDALONE /DDEEPOFC_TURNPLAN_STANDALONE /I OpenHoldem OpenHoldem\COFCBaselinePolicy.cpp OpenHoldem\COFCTurnPlan.cpp OpenHoldem\COFCBaselinePolicySelftest.cpp /Fe:COFCBaselinePolicySelftest.exe && COFCBaselinePolicySelftest.exe'
          cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw "Policy selftest failed: $LASTEXITCODE" }

      - name: Build dependency chain
        shell: pwsh
        run: |
          $root = (Resolve-Path '.').Path + '\'
          $common = @('/m','/t:Build','/p:Configuration=Release','/p:Platform=Win32',"/p:SolutionDir=$root",'/v:minimal')
          $projects = @(
            'DLLs/Files_DLL/Files.vcxproj',
            'DLLs/WindowFunctions_DLL/window_functions.vcxproj',
            'DLLs/StringFunctions_DLL/string_functions.vcxproj',
            'DLLs/Debug_DLL/Debug.vcxproj',
            'DLLs/Preferences_DLL/Preferences.vcxproj',
            'DLLs/Globals_DLL/globals.vcxproj',
            'DLLs/GamestateValidation_DLL/GamestateValidation.vcxproj',
            'DLLs/User_DLL/user.vcxproj',
            'PokerTracker_Query_Definitions/pokertracker_query_definitions.vcxproj',
            'Reference Mouse DLL/Reference Mouse DLL.vcxproj',
            'Reference Keyboard DLL/Reference Keyboard DLL.vcxproj'
          )
          foreach ($project in $projects) {
            & msbuild $project @common
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $project" }
          }

      - name: Build OpenHoldem Release Win32
        shell: pwsh
        run: |
          $root = (Resolve-Path '.').Path + '\'
          msbuild OpenHoldem/OpenHoldem.vcxproj /m /t:Build /p:Configuration=Release /p:Platform=Win32 "/p:SolutionDir=$root" /p:BuildProjectReferences=true /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "OpenHoldem Win32 build failed: $LASTEXITCODE" }

      - name: Collect runtime package
        shell: pwsh
        run: |
          $release = 'Release'
          $out = 'artifact/DeepOFC_FP0_Fantasy15_Windows'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          if (-not (Test-Path "$release/OpenHoldem.exe")) {
            throw "Compiled OpenHoldem.exe not found in $release"
          }
          Copy-Item "$release/OpenHoldem.exe" $out
          Get-ChildItem $release -Filter '*.dll' | Copy-Item -Destination $out
          if (Test-Path "$release/tessdata") {
            Copy-Item "$release/tessdata" "$out/tessdata" -Recurse
          }
          @'
          OpenOFC / DeepOFC FP0 code package

          This artifact contains the compiled OFC-native runtime code and required DLLs.
          The operational KKPoker TableMap and private replay evidence are deliberately
          not stored in this repository artifact. Assemble the certified TableMap into
          scraper/ before a live test.
          '@ | Set-Content -Encoding UTF8 "$out/README_OPENOFC.txt"

      - name: Upload Windows runtime
        uses: actions/upload-artifact@v4
        with:
          name: DeepOFC_FP0_Fantasy15_Windows
          path: artifact/DeepOFC_FP0_Fantasy15_Windows
          if-no-files-found: error
