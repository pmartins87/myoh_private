name: OpenOFC gameflow v2 build

on:
  push:
    branches:
      - deepofc
      - 'agent/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build-package:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply OpenOFC source repairs
        shell: pwsh
        run: |
          python -c "import tools.apply_openofc_runtime_repair as r; r.patch_transform(); r.patch_opponent_discards(); r.patch_capture(); print('OpenOFC runtime source repair applied successfully')"
          if ($LASTEXITCODE -ne 0) { throw "OpenOFC runtime repair failed: $LASTEXITCODE" }
          python tools/apply_openofc_log248_repair.py
          if ($LASTEXITCODE -ne 0) { throw "OpenOFC log248 repair failed: $LASTEXITCODE" }
          python tools/run_openofc_gameflow_v2.py
          if ($LASTEXITCODE -ne 0) { throw "OpenOFC gameflow v2 repair failed: $LASTEXITCODE" }

      - name: Assert OpenOFC v2 code contract
        shell: pwsh
        run: |
          $scraper = Get-Content -Raw 'OpenHoldem/COFCScraper.cpp'
          $state = Get-Content -Raw 'OpenHoldem/COFCState.h'
          $visual = Get-Content -Raw 'OpenHoldem/COFCVisualObservation.h'
          $runtime = Get-Content -Raw 'OpenHoldem/COFCRuntimeController.cpp'
          $policy = Get-Content -Raw 'OpenHoldem/COFCBaselinePolicy.cpp'
          $lazy = Get-Content -Raw 'OpenHoldem/CLazyScraper.cpp'
          $heartbeat = Get-Content -Raw 'OpenHoldem/CHeartbeatThread.cpp'
          $fantasy = Get-Content -Raw 'OpenHoldem/COFCFantasy15PixelRecognizer.cpp'
          $orchestrator = Get-Content -Raw 'OpenHoldem/COFCTurnOrchestrator.cpp'

          if ($scraper -notmatch 'DEEPOFC_NATIVE_FANTASY15_RECOGNIZER_CERTIFIED\s+1') {
            throw 'Fantasy recognizer is not enabled'
          }
          if (($scraper -notmatch 'OPENOFC_JOKER_RANK_TOKEN') -or
              ($scraper -notmatch 'rank_result\s*==\s*"X"') -or
              ($scraper -match 'joker1_region|joker2_region')) {
            throw 'Joker is not rank-token X only in the standard TableMap path'
          }
          if (($state -notmatch 'kOFCCardJokerGeneric') -or
              ($state -notmatch 'decision_finalizable') -or
              ($state -notmatch 'hero_timer_active') -or
              ($visual -notmatch 'hero_timer_active')) {
            throw 'OFC-native timing/Joker state contract is missing'
          }
          if (($scraper -notmatch 'OPENOFC_SIMULTANEOUS_PREPARE') -or
              ($runtime -notmatch 'mode=%s dealer=%d hero=%d timer=%d finalizable=%d') -or
              ($runtime -notmatch 'confirm=HELD') -or
              ($runtime -notmatch 'opponent_final_info=1 reanalyze=1')) {
            throw 'Dealer provisional-arrangement/finalization state machine is missing'
          }
          if (($lazy -notmatch 'OPENOFC_ROUND0_FRESH_RECONSTRUCT') -or
              ($heartbeat -notmatch 'kOpenOFCContractVersion\s*=\s*2')) {
            throw 'New-hand recovery or TableMap contract v2 gate is missing'
          }
          if (($policy -notmatch 'fantasy_count\s*<\s*14') -or
              ($policy -notmatch 'fantasy_count\s*>\s*17') -or
              ($fantasy -notmatch '!original_fantasy_cards\.empty\(\)') -or
              ($scraper -notmatch 'Initial dynamic Fantasy fan') -or
              ($scraper -notmatch 'stable 14\.\.17-card lineage')) {
            throw 'Fantasy 14..17 dynamic-reflow contract is missing'
          }
          if ($orchestrator -notmatch 'opponent_drift_allowed') {
            throw 'Provisional dealer arrangement cannot tolerate opponent reveal drift'
          }
          if (($scraper -match 'p_auto_ocr|GetDetectTemplateResult|GetDetectTemplatesResult|get_ocr_result') -and
              ($scraper -notmatch 'ScrapeOFCFantasyVisualObservation')) {
            throw 'Unexpected OCR/template dependency in OpenOFC scraper'
          }
          if (($heartbeat -notmatch 'holdem_engines_bypassed=1') -or
              ($heartbeat -notmatch 'legacy_holdem_fallback=0')) {
            throw 'OpenOFC Holdem isolation contract is missing'
          }

      - name: Materialize and validate canonical TableMap v2
        shell: pwsh
        run: |
          $source = 'OpenOFC/TableMaps/KKPoker_OpenOFC_JokerUltimate_v2.tm.gz.b64'
          $canonical = 'OpenOFC/TableMaps/KKPoker_OpenOFC_JokerUltimate_v2.tm'
          $gz = 'OpenOFC/TableMaps/KKPoker_OpenOFC_JokerUltimate_v2.tm.gz'
          if (-not (Test-Path $source)) { throw "Canonical TableMap source missing: $source" }
          $bytes = [Convert]::FromBase64String((Get-Content -Raw $source).Trim())
          [IO.File]::WriteAllBytes($gz, $bytes)
          $input = [IO.File]::OpenRead($gz)
          try {
            $gzip = New-Object IO.Compression.GzipStream($input, [IO.Compression.CompressionMode]::Decompress)
            try {
              $output = [IO.File]::Create($canonical)
              try { $gzip.CopyTo($output) } finally { $output.Dispose() }
            } finally { $gzip.Dispose() }
          } finally { $input.Dispose() }
          Remove-Item $gz -Force

          python tools/validate_openofc_tablemap.py $canonical --require-contract 2
          if ($LASTEXITCODE -ne 0) { throw "Canonical TableMap v2 validation failed: $LASTEXITCODE" }

          $text = Get-Content -Raw $canonical
          if ($text -notmatch 's\$ofc_joker_rank_token\s+X') { throw 'TableMap lacks Joker rank-token X contract' }
          if (($text -notmatch 'r\$ofc_p0_timer_active') -or ($text -notmatch 'r\$ofc_p1_timer_active')) {
            throw 'TableMap lacks normal timer-active regions'
          }
          if ($text -match 'r\$ofc_.*joker[12]') { throw 'TableMap still contains separate Joker identity regions' }

          $expected = 'a3dfefa9b7090bf0c4896438f27e62d9c5a1da06c8ddd3b5fc2fda8688b8d0dc'
          $actual = (Get-FileHash $canonical -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Canonical TableMap SHA256 mismatch: expected=$expected actual=$actual"
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Compile and run deterministic policy selftest
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $command = '"' + $devcmd + '" -arch=x86 -host_arch=x64 && cl /nologo /EHsc /O2 /MD /std:c++14 /DDEEPOFC_POLICY_STANDALONE /DDEEPOFC_TURNPLAN_STANDALONE /I OpenHoldem OpenHoldem\COFCBaselinePolicy.cpp OpenHoldem\COFCTurnPlan.cpp OpenHoldem\COFCBaselinePolicySelftest.cpp /Fe:COFCBaselinePolicySelftest.exe && COFCBaselinePolicySelftest.exe'
          cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw "Policy selftest failed: $LASTEXITCODE" }

      - name: Build dependency chain
        shell: pwsh
        run: |
          $root = (Resolve-Path '.').Path + '\'
          $common = @('/m','/t:Build','/p:Configuration=Release','/p:Platform=Win32',"/p:SolutionDir=$root",'/v:minimal')
          $projects = @(
            'DLLs/Files_DLL/Files.vcxproj',
            'DLLs/WindowFunctions_DLL/window_functions.vcxproj',
            'DLLs/StringFunctions_DLL/string_functions.vcxproj',
            'DLLs/Debug_DLL/Debug.vcxproj',
            'DLLs/Preferences_DLL/Preferences.vcxproj',
            'DLLs/Globals_DLL/globals.vcxproj',
            'DLLs/GamestateValidation_DLL/GamestateValidation.vcxproj',
            'DLLs/User_DLL/user.vcxproj',
            'PokerTracker_Query_Definitions/pokertracker_query_definitions.vcxproj',
            'Reference Mouse DLL/Reference Mouse DLL.vcxproj',
            'Reference Keyboard DLL/Reference Keyboard DLL.vcxproj'
          )
          foreach ($project in $projects) {
            & msbuild $project @common
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $project" }
          }

      - name: Build OpenHoldem Release Win32
        shell: pwsh
        run: |
          $root = (Resolve-Path '.').Path + '\'
          msbuild OpenHoldem/OpenHoldem.vcxproj /m /t:Build /p:Configuration=Release /p:Platform=Win32 "/p:SolutionDir=$root" /p:BuildProjectReferences=true /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "OpenHoldem Win32 build failed: $LASTEXITCODE" }

      - name: Collect runtime package
        shell: pwsh
        run: |
          $release = 'Release'
          $out = 'artifact/OpenOFC_Gameflow_v2_Windows'
          $canonical = 'OpenOFC/TableMaps/KKPoker_OpenOFC_JokerUltimate_v2.tm'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          if (-not (Test-Path "$release/OpenHoldem.exe")) { throw "Compiled OpenHoldem.exe not found" }
          Copy-Item "$release/OpenHoldem.exe" $out
          Get-ChildItem $release -Filter '*.dll' | Copy-Item -Destination $out
          if (Test-Path "$release/tessdata") { Copy-Item "$release/tessdata" "$out/tessdata" -Recurse }

          $scraperOut = Join-Path $out 'scraper'
          New-Item -ItemType Directory -Force -Path $scraperOut | Out-Null
          Copy-Item $canonical (Join-Path $scraperOut 'KKPoker_OpenOFC_JokerUltimate_v2.tm')
          $tmFiles = @(Get-ChildItem $out -Recurse -Filter '*.tm')
          if ($tmFiles.Count -ne 1) { throw "Runtime must contain exactly one TableMap; got $($tmFiles.Count)" }

          @'
          OpenOFC gameflow v2 diagnostic runtime

          Canonical TableMap:
            scraper/KKPoker_OpenOFC_JokerUltimate_v2.tm
          Contract: s$openofc_contract 2
          SHA256: a3dfefa9b7090bf0c4896438f27e62d9c5a1da06c8ddd3b5fc2fda8688b8d0dc

          Key v2 semantics:
          - normal OFC preparation is simultaneous and can start as soon as cards exist;
          - dealer-side early placement is provisional; Confirm is held until Hero timer is active;
          - final opponent information triggers a fresh analysis/reposition before Confirm;
          - Fantasy starts immediately and supports 14..17 cards;
          - Fantasy loose-card source rectangles are detected again after every placement;
          - Joker is a rank transform token X; separate joker1/joker2 TableMap regions are removed.
          '@ | Set-Content -Encoding UTF8 "$out/README_OPENOFC.txt"

      - name: Upload Windows runtime
        uses: actions/upload-artifact@v4
        with:
          name: OpenOFC_Gameflow_v2_Windows
          path: artifact/OpenOFC_Gameflow_v2_Windows
          if-no-files-found: error
